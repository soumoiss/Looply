<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Looply · Painel ADM</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cabin+Sketch:wght@400;700&family=Cormorant+Garamond:wght@500..700&family=Inter:wght@400..800&family=JetBrains+Mono:wght@400..700&display=swap">
<style>
:root{--primary:#7010b0;--p2:#b04fe0;--neon:#39ff9c;--cy:#00f5d4;--warn:#f5a623;--bad:#ff4d6d;--ease:cubic-bezier(.22,1,.36,1);--spring:cubic-bezier(.34,1.5,.64,1);
--ui:Inter,ui-sans-serif,-apple-system,"Segoe UI",sans-serif;--mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;--serif:Quillen,"Cormorant Garamond",Georgia,serif;
--bg:#09060f;--strong:#150e22;--soft:#0f0a19;--surface:rgba(24,16,38,.78);--text:#eee8f7;--muted:#9a8db0;--line:rgba(190,140,255,.16);--glow:rgba(57,255,156,.35);
--lens-a:rgba(255,255,255,.12);--lens-b:rgba(255,255,255,.02);--lens-edge:rgba(255,255,255,.2);color-scheme:dark}
html[data-theme=light]{--bg:#f3eefa;--strong:#fff;--soft:#faf7fc;--surface:rgba(255,255,255,.9);--text:#221a2e;--muted:#7a6e8c;--line:rgba(112,16,176,.15);--glow:rgba(112,16,176,.25);--neon:#0b8f55;--cy:#0a7fc2;--lens-a:rgba(255,255,255,.7);--lens-b:rgba(255,255,255,.3);--lens-edge:rgba(255,255,255,.8);color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0}
body{font-family:var(--ui);background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden;
background-image:radial-gradient(70vmax 50vmax at 5% -10%,rgba(155,93,229,.25),transparent 60%),radial-gradient(60vmax 40vmax at 100% 10%,rgba(57,255,156,.07),transparent 60%)}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none;touch-action:manipulation}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid var(--neon);outline-offset:2px}
.mono{font-family:var(--mono)}
#mx{position:fixed;inset:0;z-index:0;opacity:.2;pointer-events:none}
body::after{content:"";position:fixed;inset:0;z-index:1;pointer-events:none;background:repeating-linear-gradient(rgba(255,255,255,.022) 0 1px,transparent 1px 3px),radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.45))}
html[data-theme=light] body::after{opacity:.35}
.app{position:relative;z-index:2}
.glass{position:relative;background:linear-gradient(135deg,var(--lens-a),var(--lens-b));-webkit-backdrop-filter:blur(10px) saturate(190%);backdrop-filter:blur(10px) saturate(190%);border:1px solid var(--lens-edge);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 14px 34px rgba(0,0,0,.35)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(160px 70px at var(--mx,18%) var(--my,-12%),rgba(255,255,255,.28),transparent 70%)}.glass>*{position:relative;z-index:1}
.gh{position:sticky;top:calc(env(safe-area-inset-top) + 8px);z-index:40;margin:8px auto 14px;width:min(calc(100% - 20px),900px);display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:22px}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0;text-decoration:none;color:inherit;min-height:44px}
.mark{width:42px;height:42px;border-radius:14px;background:var(--strong);border:1px solid var(--line);display:grid;place-items:center;box-shadow:0 0 18px var(--glow)}.mark svg{width:26px;height:26px;color:var(--neon);animation:spin 6s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.brand strong{display:block;font-family:'Cabin Sketch',cursive;font-size:28px;line-height:1;color:var(--p2);font-weight:400}.brand small{display:block;font:600 10px var(--mono);letter-spacing:.08em;color:var(--neon)}
.ib{position:relative;width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:color-mix(in srgb,var(--strong) 80%,transparent);display:grid;place-items:center;color:var(--text);flex:none;transition:transform .25s var(--spring),box-shadow .3s}.ib:active{transform:scale(.88)}.ib:hover{box-shadow:0 0 14px var(--glow)}
.ib .bg{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--bad);color:#fff;font:700 10px var(--mono);display:grid;place-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:99px;font:700 11px var(--mono);letter-spacing:.04em;border:1px solid var(--line);background:color-mix(in srgb,var(--strong) 70%,transparent)}
.chip.ok{color:var(--neon);border-color:color-mix(in srgb,var(--neon) 40%,transparent)}.chip.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}.chip.w{color:var(--warn)}.chip.p{color:var(--p2)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--neon);box-shadow:0 0 10px var(--neon);animation:pl 1.6s infinite}@keyframes pl{50%{opacity:.35}}
.shell{width:min(calc(100% - 24px),900px);margin:0 auto;padding-bottom:calc(120px + env(safe-area-inset-bottom))}
.view{display:none}.view.on{display:block;animation:rise .5s var(--ease)}@keyframes rise{from{opacity:0;transform:translateY(14px)}}
/* cartões */
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px;margin-bottom:12px;transition:border-color .3s,box-shadow .3s}
.card.br::before,.card.br::after{content:"";position:absolute;width:12px;height:12px;border:2px solid var(--neon);opacity:.7;pointer-events:none}.card.br::before{top:-1px;left:-1px;border-right:0;border-bottom:0;border-radius:6px 0 0 0}.card.br::after{bottom:-1px;right:-1px;border-left:0;border-top:0;border-radius:0 0 6px 0}
h3.sec{margin:20px 4px 10px;font:700 11px var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}h3.sec::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.term{font:500 13px/1.7 var(--mono);color:var(--neon)}.term .pr{color:var(--p2)}.term .cur{display:inline-block;width:8px;height:15px;background:var(--neon);vertical-align:-2px;animation:bl 1s steps(1) infinite}@keyframes bl{50%{opacity:0}}
.term b{color:var(--text);font-weight:600}.term .mut{color:var(--muted)}
.kpis{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 8px;scroll-snap-type:x proximity}.kpis::-webkit-scrollbar{display:none}
.kpi{flex:none;scroll-snap-align:start;width:152px;padding:12px;border-radius:18px;background:var(--surface);border:1px solid var(--line);display:grid;gap:2px;position:relative;overflow:hidden}
.kpi small{font:600 10.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}.kpi b{font:700 26px var(--mono);letter-spacing:-.02em}.kpi .d{font:700 11px var(--mono);color:var(--neon)}.kpi .d.dn{color:var(--bad)}
.kpi svg.sp{width:100%;height:34px;margin-top:4px}.kpi svg.sp path{fill:none;stroke:var(--neon);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.kpi svg.sp .ar{fill:url(#ga);stroke:none;opacity:.5}
.qa{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.qb{display:flex;align-items:center;gap:10px;min-height:52px;padding:0 14px;border-radius:16px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:14px;text-align:left;transition:all .3s var(--spring);position:relative}.qb:hover{border-color:var(--neon);box-shadow:0 0 16px var(--glow)}.qb:active{transform:scale(.95)}.qb svg{color:var(--neon)}.qb{min-width:0;padding:0 12px;white-space:nowrap;font-size:13.5px}.qb .chip{margin-left:auto;height:22px;padding:0 8px;font-size:10px}.qb .bg{margin-left:auto;min-width:22px;height:22px;border-radius:99px;background:var(--bad);color:#fff;font:700 11px var(--mono);display:grid;place-items:center}
.feed{display:grid;gap:2px;font:500 12.5px/1.5 var(--mono);max-height:300px;overflow:hidden}.feed div{display:flex;gap:8px;padding:5px 2px;border-bottom:1px dashed var(--line);animation:fin .4s var(--ease)}@keyframes fin{from{opacity:0;transform:translateX(-10px)}}
.feed time{color:var(--muted);flex:none}.feed .t-l{color:var(--cy)}.feed .t-r{color:var(--bad)}.feed .t-m{color:var(--p2)}.feed .t-s{color:var(--neon)}.feed .t-k{color:var(--warn)}.feed span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
/* módulos */
.srch{display:flex;align-items:center;gap:10px;min-height:50px;padding:0 14px;border-radius:16px;background:var(--strong);border:1px solid var(--line);color:var(--muted);margin-bottom:12px;transition:box-shadow .3s}.srch:focus-within{box-shadow:0 0 0 2px var(--neon);color:var(--neon)}.srch input{flex:1;min-width:0;border:0;background:none;outline:0;font-size:16px;color:var(--text)}
.cats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}@media(min-width:640px){.cats{grid-template-columns:repeat(3,1fr)}}
.cat{position:relative;display:grid;gap:10px;align-content:space-between;min-height:118px;padding:14px;text-align:left;border-radius:20px;background:var(--surface);border:1px solid var(--line);overflow:hidden;transition:transform .35s var(--spring),border-color .3s,box-shadow .3s;animation:rise .5s var(--ease) both;animation-delay:calc(var(--i)*45ms)}
.cat::before{content:"";position:absolute;inset:auto -30% -60% auto;width:140px;height:140px;border-radius:50%;background:radial-gradient(circle,var(--glow),transparent 70%);opacity:.0;transition:opacity .4s}.cat:hover::before,.cat:active::before{opacity:1}
.cat:hover{border-color:var(--neon);transform:translateY(-3px);box-shadow:0 10px 30px var(--glow)}.cat:active{transform:scale(.96)}
.cat .ix{font:700 10.5px var(--mono);color:var(--muted);letter-spacing:.1em}.cat .ci{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:var(--neon);background:color-mix(in srgb,var(--neon) 10%,transparent);border:1px solid color-mix(in srgb,var(--neon) 30%,transparent)}.cat .ci svg{width:24px;height:24px}
.cat b{font-size:16px;display:block}.cat small{font:600 11px var(--mono);color:var(--muted)}
.res{display:grid;gap:6px}.res button{display:flex;align-items:center;gap:12px;width:100%;min-height:54px;padding:6px 12px;border-radius:16px;background:var(--surface);border:1px solid var(--line);text-align:left;font-weight:650;transition:all .25s var(--spring)}.res button:hover{border-color:var(--neon)}.res button:active{transform:scale(.97)}.res small{margin-left:auto;font:600 10.5px var(--mono);color:var(--muted)}.res svg{color:var(--neon)}
/* console */
.con{display:grid;grid-template-rows:1fr auto;height:calc(100dvh - 250px);min-height:340px;background:#05030a;border:1px solid color-mix(in srgb,var(--neon) 35%,transparent);border-radius:20px;overflow:hidden;box-shadow:0 0 30px var(--glow)}html[data-theme=light] .con{background:#0d0916}
.con .out{overflow-y:auto;padding:14px;font:500 13px/1.6 var(--mono);color:#b8ffd9;white-space:pre-wrap;overflow-wrap:anywhere}.con .out .e{color:#ff8da1}.con .out .m{color:#9a8db0}.con .out .p{color:#c58bff}.con .out .c{color:#00f5d4}.con .out table{border-collapse:collapse;width:100%;font-size:12px}.con .out td,.con .out th{padding:3px 8px 3px 0;text-align:left;border-bottom:1px dashed rgba(255,255,255,.12)}
.con .in{display:flex;align-items:center;gap:8px;padding:8px 12px;border-top:1px solid color-mix(in srgb,var(--neon) 25%,transparent);font:500 14px var(--mono)}.con .in span{color:var(--p2);white-space:nowrap}.con input{flex:1;min-width:0;background:none;border:0;outline:0;font:500 16px var(--mono);color:#e8fff3;min-height:44px}
.sugg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:10px}.sugg::-webkit-scrollbar{display:none}.sugg button{flex:none;height:34px;padding:0 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font:600 12px var(--mono);color:var(--neon)}
/* dock */
.dock{position:fixed;z-index:35;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom));width:min(calc(100% - 20px),520px);display:flex;padding:5px;border-radius:28px}
.dock button{position:relative;z-index:1;flex:1;min-height:54px;display:grid;place-items:center;gap:1px;align-content:center;font-size:10px;font-weight:700;color:var(--muted);border-radius:20px;transition:color .3s}.dock button.on{color:var(--neon)}.dock button.on svg{transform:translateY(-1px) scale(1.1)}.dock svg{transition:transform .4s var(--spring)}
.dock .liq{position:absolute;z-index:0;top:5px;bottom:5px;left:0;border-radius:20px;background:color-mix(in srgb,var(--neon) 13%,transparent);border:1px solid color-mix(in srgb,var(--neon) 35%,transparent);box-shadow:0 0 16px var(--glow);transition:transform .55s var(--spring),width .55s var(--spring)}
/* modal */
dialog{border:0;padding:0;background:transparent;color:var(--text);max-width:100vw;width:100%;max-height:100dvh;overflow:visible;margin:auto 0 0}
dialog::backdrop{background:rgba(3,1,8,.65);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);animation:fade .35s}dialog[open]{animation:sheet .5s var(--spring)}@keyframes fade{from{opacity:0}}@keyframes sheet{from{opacity:0;transform:translateY(70px) scale(.96)}}
.sheet{width:min(100%,680px);margin:0 auto;height:92dvh;display:flex;flex-direction:column;background:var(--bg);border-radius:28px 28px 0 0;border:1px solid var(--line);border-bottom:0;box-shadow:0 -10px 60px var(--glow);overflow:hidden}
@media(min-width:760px){dialog{margin:auto}.sheet{height:min(86dvh,800px);border-radius:28px;border-bottom:1px solid var(--line)}}
.sh{display:flex;align-items:center;gap:8px;padding:12px 12px 10px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--strong) 80%,transparent)}.sh h2{flex:1;margin:0;font:700 16px var(--mono);letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sh h2::before{content:"> ";color:var(--neon)}
.mb{flex:1;overflow-y:auto;padding:14px 14px calc(26px + env(safe-area-inset-bottom));overscroll-behavior:contain}.mb.in>*{animation:rise .4s var(--ease) both}
.frm{display:grid;gap:12px;margin-top:6px}label.f{display:grid;gap:6px}label.f>span{font:700 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
label.f input,label.f select,label.f textarea{width:100%;min-height:48px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--strong);font-size:16px;outline:0;color:var(--text);transition:box-shadow .25s,border-color .25s}label.f textarea{resize:vertical;line-height:1.4}
label.f input:focus,label.f select:focus,label.f textarea:focus{border-color:var(--neon);box-shadow:0 0 0 3px color-mix(in srgb,var(--neon) 20%,transparent)}input[type=color]{padding:4px!important;height:48px}
.drop{display:block}.dz{display:flex;align-items:center;justify-content:center;gap:10px;min-height:64px;border-radius:16px;border:2px dashed color-mix(in srgb,var(--neon) 45%,transparent);color:var(--neon);font-weight:700;cursor:pointer;transition:background .3s}.dz:hover{background:color-mix(in srgb,var(--neon) 8%,transparent)}
.tgl{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:54px;padding:6px 14px;border-radius:16px;border:1px solid var(--line);background:var(--strong);font-weight:650}
.tg{position:relative;flex:none;width:54px;height:32px;border-radius:99px;background:color-mix(in srgb,var(--muted) 35%,transparent);transition:background .3s,box-shadow .3s}.tg::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.4);transition:transform .4s var(--spring)}.tg[aria-pressed=true]{background:var(--neon);box-shadow:0 0 14px var(--glow)}.tg[aria-pressed=true]::after{transform:translateX(22px)}
.btn{min-height:50px;padding:0 20px;border-radius:15px;font-weight:800;border:1px solid var(--line);background:var(--strong);display:flex;align-items:center;justify-content:center;gap:8px;width:100%;transition:transform .25s var(--spring),box-shadow .3s}.btn:active{transform:scale(.96)}
.btn.main{color:#06130d;border:0;background:linear-gradient(120deg,var(--neon),var(--cy));box-shadow:0 8px 26px var(--glow)}.btn.pp{color:#fff;border:0;background:linear-gradient(120deg,var(--primary),var(--p2))}.btn.dg{color:#fff;background:var(--bad);border:0}.btn.sm{min-height:40px;width:auto;padding:0 14px;font-size:13px}.btn:disabled{opacity:.45}
.bg2{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin:10px 0}
.seg{display:flex;gap:2px;padding:3px;border-radius:14px;background:var(--strong);border:1px solid var(--line);overflow-x:auto;scrollbar-width:none}.seg::-webkit-scrollbar{display:none}.seg button{flex:1 0 auto;min-height:36px;padding:0 12px;border-radius:11px;font:700 12px var(--mono);color:var(--muted);transition:all .3s var(--spring)}.seg button.on{background:color-mix(in srgb,var(--neon) 14%,transparent);color:var(--neon);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--neon) 40%,transparent)}
.fl{display:grid;gap:8px;margin-bottom:10px}
.rows{display:grid;gap:6px}.r{display:flex;align-items:center;gap:12px;width:100%;min-height:62px;padding:8px 12px;border-radius:16px;background:var(--surface);border:1px solid var(--line);text-align:left;transition:all .25s var(--spring);animation:rise .35s var(--ease) both}.r:hover{border-color:var(--neon)}.r:active{transform:scale(.98)}
.r .av{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--g1),var(--g2))}.r .ico{width:40px;height:40px;border-radius:12px;flex:none;display:grid;place-items:center;color:var(--neon);background:color-mix(in srgb,var(--neon) 10%,transparent)}
.r .tx{flex:1;min-width:0}.r b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.r small{display:block;font:500 11.5px var(--mono);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}.r .bd{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;max-width:42%}
.cnt{margin:10px 2px 0;font:600 11px var(--mono);color:var(--muted)}
.hd{display:flex;align-items:center;gap:14px;margin-bottom:12px}.hd .av{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-size:26px;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--g1),var(--g2));box-shadow:0 0 22px var(--glow)}.hd h4{margin:0;font-size:20px}.hd small{font:500 12px var(--mono);color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}.stats div{padding:10px 4px;text-align:center;border-radius:14px;background:var(--surface);border:1px solid var(--line)}.stats b{display:block;font:700 17px var(--mono)}.stats small{font:600 10px var(--mono);color:var(--muted)}
pre.js{margin:0;padding:14px;border-radius:16px;background:#05030a;color:#b8ffd9;font:500 12.5px/1.6 var(--mono);overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;border:1px solid color-mix(in srgb,var(--neon) 30%,transparent)}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chips .chip button{margin-left:4px;color:var(--bad)}
.bub{max-width:82%;padding:8px 12px;border-radius:16px;margin:4px 0;background:var(--surface);border:1px solid var(--line);font-size:14px;overflow-wrap:anywhere}.bub.me{margin-left:auto;background:linear-gradient(135deg,var(--primary),var(--p2));color:#fff;border:0}.bub small{display:block;font:500 10px var(--mono);opacity:.7;margin-top:2px}
.bar{height:8px;border-radius:99px;background:var(--strong);overflow:hidden;border:1px solid var(--line)}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--neon),var(--cy));transition:width .4s}
.mat{display:grid;grid-template-columns:1fr repeat(3,56px);gap:6px;align-items:center;font-size:13px}.mat .h{font:700 10px var(--mono);color:var(--muted);text-align:center}

.pal>div{width:min(100%,600px);border-radius:22px;padding:10px;animation:sheet .4s var(--spring);background:var(--bg);border:1px solid var(--neon);box-shadow:0 0 40px var(--glow)}.pal .res{max-height:55dvh;overflow-y:auto;margin-top:8px}
