<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#F5F0FA">
  <title>Redirecionando para mensagens — Looply</title>
  <script>
    const destination = new URL("mensagens.html", window.location.href);
    destination.search = window.location.search;
    destination.hash = window.location.hash;
    window.location.replace(destination.href);
  </script>
</head>
<body>
  <p><a id="messages-link" href="mensagens.html">Abrir mensagens</a></p>
  <script>
    const link = document.getElementById("messages-link");
    link.href = destination.href;
  </script>
</body>
</html>
