<html lang="pt-BR">
<head>

<title>Conversa — Looply</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cabin+Sketch:wght@400;700&family=Cormorant+Garamond:wght@500..700&family=Inter:wght@400..800&display=swap">
<style>
:root{--primary:#7010b0;--bg:#f5f0fa;--strong:#fff;--soft:#faf7fc;--surface:rgba(255,255,255,.94);--text:#29252f;--muted:#817b89;--line:rgba(102,82,126,.13);--wax:#a3123a;

:root[data-theme=dark]{--bg:#130e1b;--strong:#241a33;--soft:#1b1328;--surface:rgba(34,25,48,.94);--text:#f3edf9;--muted:#a698b9;--line:rgba(205,160,255,.15);--lens-a:rgba(255,255,255,.13);--lens-b:rgba(255,255,255,.02);--lens-edge:rgba(255,255,255,.26);--theirs:#2b2040;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:var(--ui);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;overflow-x:hidden;
background-image:radial-gradient(70vmax 46vmax at 0% -12%,rgba(155,93,229,.22),transparent 60%),radial-gradient(60vmax 40vmax at 100% 8%,rgba(241,91,181,.12),transparent 60%)}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none;touch-action:manipulation}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}svg.i.f{fill:currentColor}
:focus-visible{outline:3px solid rgba(155,93,229,.5);outline-offset:2px}
.shell{width:min(calc(100% - 24px),680px);margin:0 auto;padding-bottom:calc(120px + env(safe-area-inset-bottom))}
/* vidro lente */
.glass{background:linear-gradient(135deg,var(--lens-a),var(--lens-b));-webkit-backdrop-filter:blur(var(--lens-blur)) saturate(190%) brightness(1.07);backdrop-filter:blur(var(--lens-blur)) saturate(190%) brightness(1.07);border:1px solid var(--lens-edge);
box-shadow:inset 0 1.5px 0 rgba(255,255,255,.8),inset 0 -1px 0 rgba(255,255,255,.2),inset 0 0 24px rgba(255,255,255,.14),0 14px 34px rgba(70,30,120,.18);position:relative}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:0;background:radial-gradient(170px 72px at var(--mx,18%) var(--my,-12%),rgba(255,255,255,.6),transparent 70%),linear-gradient(112deg,rgba(255,255,255,.45),rgba(255,255,255,0) 26%,rgba(255,255,255,0) 70%,rgba(255,255,255,.22))}
.glass>*{position:relative;z-index:1}
.gh{position:sticky;top:calc(env(safe-area-inset-top) + 8px);z-index:40;margin:8px auto 14px;width:min(calc(100% - 20px),700px);display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:22px}
.gh.scrolled{--lens-blur:14px}
.brand{display:flex;align-items:center;gap:11px;text-decoration:none;flex:1;min-width:0;min-height:44px;color:inherit}
.mark{width:42px;height:42px;border-radius:14px;background:var(--strong);border:1px solid var(--line);display:grid;place-items:center}.mark svg{width:26px;height:26px;color:var(--primary);animation:spin 6s linear infinite}

.acc{display:flex;align-items:center;min-height:44px;padding:3px;border-radius:99px;border:1px solid var(--line);background:var(--strong)}
.av{position:relative;width:var(--s,40px);height:var(--s,40px);flex:none;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:calc(var(--s,40px)*.4);background:linear-gradient(135deg,var(--g1),var(--g2))}
.av img{width:100%;height:100%;object-fit:cover;border-radius:50%}.av .pr{position:absolute;right:-1px;bottom:-1px;width:calc(var(--s,40px)*.3);height:calc(var(--s,40px)*.3);min-width:10px;min-height:10px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 2px var(--bg)}
.av.ring{box-shadow:0 0 0 2px var(--bg),0 0 0 4px #22c55e}.av.grp{background:linear-gradient(135deg,#7010b0,#e05bb5)}
.menu{position:fixed;z-index:70;top:calc(env(safe-area-inset-top) + 72px);right:12px;width:min(310px,calc(100vw - 24px));padding:8px;border-radius:24px;transform-origin:top right;animation:pop .32s var(--spring)}
.menu[hidden]{display:none}@keyframes pop{from{opacity:0;transform:scale(.88) translateY(-8px)}}
.mrow{width:100%;display:flex;align-items:center;gap:12px;padding:10px 12px;min-height:50px;border-radius:16px;text-align:left;font-weight:650;font-size:14px}.mrow:hover{background:color-mix(in srgb,var(--primary) 9%,transparent)}
/* Inbox */

.title h1{font-family:var(--serif);font-size:38px;margin:0;line-height:1}.title p{margin:3px 0 0;color:var(--muted);font-size:13px}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}

.search:focus-within{box-shadow:0 0 0 3px rgba(112,16,176,.2);color:var(--primary)}.search input{flex:1;border:0;background:none;outline:0;font-size:16px;min-width:0;color:var(--text)}

.fc{min-height:38px;padding:0 15px;border-radius:99px;border:1px solid var(--line);background:var(--strong);font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap;transition:all .3s var(--spring)}.fc.on{background:var(--primary);color:#fff;border-color:transparent;transform:scale(1.04)}
.list{display:grid;gap:6px;grid-template-columns:minmax(0,1fr)}.row{min-width:0;max-width:100%}.rb{min-width:0}
.row{position:relative;display:flex;align-items:center;gap:13px;width:100%;text-align:left;padding:11px 12px;border-radius:22px;background:var(--surface);border:1px solid var(--line);min-height:76px;transition:transform .3s var(--spring),box-shadow .3s,background .3s;user-select:none;-webkit-user-select:none}
.row:active{transform:scale(.975)}.row.unr{background:linear-gradient(90deg,color-mix(in srgb,var(--primary) 8%,var(--surface)),var(--surface))}
.row.an{animation:rise .55s var(--ease) both;animation-delay:calc(var(--i)*45ms)}.rb{flex:1;min-width:0}.rt{display:flex;align-items:baseline;gap:8px}.rt b{flex:1;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rt time{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}.row.unr .rt time{color:var(--primary);font-weight:800}
.rp{display:flex;align-items:center;gap:6px;margin-top:3px;color:var(--muted);font-size:13.5px}.rp span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row.unr .rp{color:var(--text);font-weight:600}.rp .tk{flex:none}.rp .ty{color:var(--primary);font-weight:700}
.bdg{min-width:22px;height:22px;padding:0 7px;border-radius:99px;background:linear-gradient(120deg,var(--primary),#c04fd0);color:#fff;font-size:12px;font-weight:800;display:grid;place-items:center;animation:pop .4s var(--spring)}
.tk{display:inline-flex;color:var(--muted)}.tk.read{color:var(--read)}.tk svg{width:16px;height:16px}
.empty{text-align:center;padding:56px 16px;color:var(--muted);line-height:1.5}.empty svg{width:64px;height:64px;color:var(--primary);opacity:.5;animation:float 3.2s ease-in-out infinite}@keyframes float{50%{transform:translateY(-9px) rotate(-4deg)}}

.dock{position:fixed;z-index:35;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom));width:min(calc(100% - 20px),560px);display:flex;padding:5px;border-radius:28px}
.dock button{position:relative;z-index:1;flex:1;min-height:54px;display:grid;place-items:center;gap:1px;align-content:center;font-size:10px;font-weight:700;color:var(--muted);border-radius:20px;transition:color .3s}
.dock button.on{color:var(--primary)}.dock button.on svg{transform:translateY(-1px) scale(1.1)}.dock svg{transition:transform .4s var(--spring)}.dock .liq{position:absolute;z-index:0;top:5px;bottom:5px;left:0;border-radius:20px;background:linear-gradient(180deg,color-mix(in srgb,var(--primary) 18%,var(--strong)),color-mix(in srgb,var(--primary) 8%,var(--strong)));box-shadow:0 4px 14px rgba(112,16,176,.22);transition:transform .55s var(--spring),width .55s var(--spring)}
.dock .bw{position:relative;display:grid;place-items:center}.dock .dotb{top:-6px;right:-9px}
/* Conversa */
.conv{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;background:var(--bg);transform:translateX(104%);transition:transform .52s var(--ease);height:100dvh;
background-image:radial-gradient(circle at 20% 10%,rgba(155,93,229,.14),transparent 45%),radial-gradient(circle at 90% 60%,rgba(241,91,181,.1),transparent 45%),radial-gradient(rgba(112,16,176,.07) 1.2px,transparent 1.4px);background-size:auto,auto,22px 22px}
.conv.open{transform:none}body.cv .shell,body.cv .gh{transform:translateX(-18%);opacity:.4;transition:.5s var(--ease)}
.top{position:absolute;z-index:6;top:calc(env(safe-area-inset-top) + 8px);left:8px;right:8px;display:flex;align-items:center;gap:6px;padding:6px 8px 6px 4px;border-radius:24px}

.sbar{position:absolute;z-index:5;top:calc(env(safe-area-inset-top) + 76px);left:8px;right:8px;display:flex;gap:6px;align-items:center;padding:6px 10px;border-radius:20px;animation:pop .3s var(--spring)}.sbar[hidden]{display:none}.sbar input{flex:1;border:0;background:none;outline:0;font-size:16px;min-height:38px;color:var(--text);min-width:0}.sbar small{font-size:12px;color:var(--muted);font-weight:700}
.msgs{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:calc(env(safe-area-inset-top) + 92px) 12px calc(var(--cb,84px) + 20px);display:flex;flex-direction:column;scroll-behavior:smooth;-webkit-overflow-scrolling:touch}
.day{align-self:center;margin:14px 0 8px;padding:5px 13px;border-radius:99px;font-size:11.5px;font-weight:750;color:var(--muted);background:color-mix(in srgb,var(--strong) 80%,transparent);border:1px solid var(--line)}
.m{display:flex;align-items:flex-end;gap:7px;max-width:100%;margin-top:2px}.m.nw{animation:min .4s var(--spring) both}.m.me{flex-direction:row-reverse}.m.f{margin-top:10px}
@keyframes min{from{opacity:0;transform:translateY(12px) scale(.94)}}
.col{display:flex;flex-direction:column;max-width:min(78%,440px)}.m.me .col{align-items:flex-end}
.sn{font-size:11.5px;font-weight:800;margin:0 0 3px 10px;color:var(--primary)}
.sp{width:30px;flex:none}
.b{position:relative;padding:9px 13px 7px;border-radius:20px;background:var(--theirs);border:1px solid var(--line);box-shadow:0 2px 8px rgba(80,56,115,.07);line-height:1.38;font-size:15.5px;overflow-wrap:anywhere;white-space:pre-wrap;transition:transform .2s var(--spring)}
.b:active{transform:scale(.97)}.m.th .b{border-bottom-left-radius:6px}.m.th:not(.l) .b{border-bottom-left-radius:20px}
.m.me .b{background:linear-gradient(135deg,var(--mine,#7010b0),color-mix(in srgb,var(--mine,#7010b0) 72%,#fff));color:#fff;border:0;border-bottom-right-radius:6px;box-shadow:0 6px 16px color-mix(in srgb,var(--mine,#7010b0) 35%,transparent)}.m.me:not(.l) .b{border-bottom-right-radius:20px}

.m.stk .b{background:none;border:0;box-shadow:none;font-size:68px;line-height:1.05;padding:2px}.m.stk .meta{position:static;justify-content:flex-end}
.m.del .b{font-style:italic;opacity:.65;background:transparent;border:1px dashed var(--line);box-shadow:none;color:var(--muted)}
.meta{display:flex;gap:4px;align-items:center;justify-content:flex-end;font-size:10.5px;opacity:.75;margin-top:2px;font-variant-numeric:tabular-nums}.m.me .tk{color:rgba(255,255,255,.8)}.m.me .tk.read{color:#7fe3ff}
.q{margin:-2px -6px 6px;padding:6px 10px;border-radius:12px;border-left:3px solid var(--primary);background:color-mix(in srgb,var(--primary) 10%,transparent);font-size:13px;opacity:.95}.m.me .q{background:rgba(255,255,255,.18);border-left-color:#fff}
.q b{display:block;font-size:11.5px;color:var(--primary)}.m.me .q b{color:#fff}.q span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fw{font-size:11px;opacity:.7;font-style:italic;margin-bottom:3px}
.img{display:block;max-width:100%;width:240px;border-radius:14px;margin:-3px -7px 4px;background:var(--soft)}.imgx{width:220px;height:140px;border-radius:14px;margin:-3px -7px 4px;display:grid;place-items:center;background:var(--soft);color:var(--muted);font-size:12px}
.fl{display:flex;align-items:center;gap:10px;padding:4px 2px}.fl svg{width:26px;height:26px}
.au{display:flex;align-items:center;gap:10px;min-width:210px}.au button{width:40px;height:40px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;flex:none}.m.me .au button{background:#fff;color:var(--primary)}
.wf{flex:1;display:flex;align-items:center;gap:2px;height:30px}.wf i{flex:1;min-width:2px;border-radius:2px;background:currentColor;opacity:.3;transition:opacity .2s}.wf i.p{opacity:1}
.rx{display:flex;gap:3px;margin-top:-8px;padding:0 8px;position:relative;z-index:2}.rx span{font-size:13px;padding:1px 7px;border-radius:99px;background:var(--strong);border:1px solid var(--line);box-shadow:0 2px 6px rgba(0,0,0,.1);animation:pop .35s var(--spring)}
.tyb{display:flex;gap:4px;padding:13px 16px}.tyb i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:dot 1.2s infinite}.tyb i:nth-child(2){animation-delay:.15s}.tyb i:nth-child(3){animation-delay:.3s}@keyframes dot{40%{transform:translateY(-5px);background:var(--primary)}}
mark{background:#ffe066;color:#222;border-radius:4px;padding:0 1px}mark.cur{background:#ff9f1c}
.toB{position:absolute;z-index:7;right:14px;bottom:calc(var(--cb,84px) + 18px);width:46px;height:46px;border-radius:50%;opacity:0;transform:scale(.6);pointer-events:none;transition:.35s var(--spring)}.toB.on{opacity:1;transform:none;pointer-events:auto}
.toB .dotb{top:-6px;right:-4px}
.comp{position:absolute;z-index:6;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));border-radius:28px;padding:6px;-webkit-backdrop-filter:blur(12px) saturate(125%);backdrop-filter:blur(12px) saturate(125%)}
.cbar{display:flex;align-items:flex-end;gap:4px}.cbar textarea{flex:1;resize:none;border:0;background:color-mix(in srgb,var(--strong) 70%,transparent);border-radius:21px;outline:0;padding:11px 14px;max-height:120px;min-height:44px;font-size:16px;line-height:1.35;color:var(--text)}
.send{width:46px;height:46px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--mine,var(--primary)),color-mix(in srgb,var(--mine,var(--primary)) 70%,#fff));box-shadow:0 6px 16px color-mix(in srgb,var(--mine,var(--primary)) 40%,transparent);transition:transform .35s var(--spring)}.send:active{transform:scale(.86)}.send.rec{background:var(--wax);animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 12px rgba(163,18,58,.18)}}
.ctx{display:flex;align-items:center;gap:10px;padding:6px 10px 8px;font-size:13px;animation:rise .3s var(--ease)}.ctx[hidden]{display:none}.ctx div{flex:1;min-width:0;border-left:3px solid var(--primary);padding-left:9px}.ctx b{display:block;color:var(--primary);font-size:12px}.ctx span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.recui{display:none;align-items:center;gap:12px;padding:2px 6px 2px 14px;min-height:46px}.comp.rc .cbar>:not(.recui):not(.send),.comp.rc .ctx{display:none}.comp.rc .recui{display:flex;flex:1}.recui i{width:12px;height:12px;border-radius:50%;background:#f43f5e;animation:pulse 1s infinite}.recui b{font-variant-numeric:tabular-nums;font-size:16px}.recui span{flex:1;color:var(--muted);font-size:13px}
.pan{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s var(--ease)}.pan.open{grid-template-rows:1fr}.pan>div{overflow:hidden}

.ptabs{display:flex;gap:6px;padding:4px 2px 0}.ptabs button{min-height:34px;padding:0 14px;border-radius:99px;font-size:13px;font-weight:750;color:var(--muted)}.ptabs button.on{background:var(--primary);color:#fff}

.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:9px auto 8px}.sheet h2{font-family:var(--serif);font-size:26px;margin:4px 4px 10px}

/* Looply Chat 2.0 — extensões do modelo existente */
:root{--play:var(--primary);--game-paper:#fff;--game-ink:#231a2e}

function fmtText(text){let h=esc(text);
 h=h.replace(/(^|[\s(])\*([^*\n]+)\*(?=[\s.,!?)]|$)/g,"$1<b>$2</b>").replace(/(^|[\s(])_([^_\n]+)_(?=[\s.,!?)]|$)/g,"$1<i>$2</i>").replace(/(^|[\s(])~([^~\n]+)~(?=[\s.,!?)]|$)/g,"$1<s>$2</s>");
 return h.replace(/(https?:\/\/[^\s<]+)/g,u=>`<a href="${u}" target="_blank" rel="noopener noreferrer" style="color:inherit;text-decoration:underline">${u}</a>`)}

function wave(m){let h=0;for(const ch of m.id)h=(h*31+ch.charCodeAt(0))>>>0;return Array.from({length:30},(_,i)=>{h=(h*1103515245+12345)>>>0;return 18+(h>>8)%82})}
function bubble(c,m,i,arr){if(m.kind==="sys")return`<div class="day sysm">${esc(m.text)}</div>`;const mine=m.from===ME,prevM=arr[i-1],nextM=arr[i+1],f=!prevM||prevM.from!==m.from||!sameDay(prevM.t,m.t),l=!nextM||nextM.from!==m.from||!sameDay(nextM.t,m.t);
 const stk=m.kind==="sticker"&&!m.del,rq=m.reply&&c.msgs.find(x=>x.id===m.reply);let inner="";
 if(m.del)inner=`${ic("x")} Mensagem apagada`;else{
  if(m.fwd)inner+=`<div class="fw">${ic("fwd")} Encaminhada</div>`;
  if(rq)inner+=`<div class="q" data-go="${rq.id}"><b>${rq.from===ME?"Você":esc(U(rq.from).n)}</b><span>${esc(prev(rq))}</span></div>`;
  if(m.kind==="img")inner+=m.url?`<img class="img" src="${m.url}" alt="Foto enviada">`:`<div class="imgx">${ic("photo")}&nbsp;foto indisponível neste preview</div>`;
  else if(m.kind==="audio")inner+=`<div class="au" data-au="${m.id}"><button aria-label="Tocar áudio">${ic("play","f")}</button><div class="wf">${wave(m).map(v=>`<i style="height:${v}%"></i>`).join("")}</div><small>${mmss(m.dur||0)}</small></div>`;

 const rx=Object.values(m.react||{});
 return`<div class="m ${seenM.has(m.id)?"":"nw"} ${mine?"me":"th"} ${f?"f":""} ${l?"l":""} ${stk?"stk":""} ${m.del?"del":""} ${sch?"sch":""}" data-id="${m.id}">${!mine?(l?`<span class="sp">${av(m.from,30,1)}</span>`:'<span class="sp"></span>'):""}<div class="col">${!mine&&c.type==="group"&&f?`<div class="sn">${esc(U(m.from).n)}</div>`:""}<div class="b" data-b>${inner}${meta}</div>${rx.length?`<div class="rx">${[...new Set(rx)].map(e=>`<span>${e}${rx.filter(x=>x===e).length>1?" "+rx.filter(x=>x===e).length:""}</span>`).join("")}</div>`:""}</div></div>`}

 const iv=setInterval(()=>{pos+=.1;const p=pos/T;bars.forEach((x,i)=>x.classList.toggle("p",i/bars.length<=p));if(pos>=T)stop()},100);

 $("#shBox").onclick=e=>{const p=e.target.closest("[data-p]");if(p){$$("#shBox [data-p]").forEach(x=>x.classList.toggle("on",x===p));const v=p.dataset.p,n=new Date();if(v==="t"){n.setHours(20,0,0,0);at=n.getTime();if(at<=Date.now())at+=DAY}else if(v==="m"){n.setDate(n.getDate()+1);n.setHours(8,0,0,0);at=n.getTime()}else at=Date.now()+ +v}
  if(e.target.closest("#ok")){const x=$("#st").value.trim();if(!x)return toast("Escreva a mensagem.");sh.close();inp.value="";grow();btn();const c=conv(cur);c.msgs.push({id:uid(),from:ME,t:Date.now(),sched:at,kind:"text",text:x,react:{},st:"sent"});save();renderMsgs(true);toast("Mensagem agendada para "+hm(at))}}}
/* gravação de voz */
let mr,chunks=[],rtm,rsec=0;
async function startRec(){$("#comp").classList.add("rc");$("#send").classList.add("rec");$("#send").innerHTML=ic("send");rsec=0;$("#rt").textContent="00:00";recording={fake:true};
 rtm=setInterval(()=>{rsec++;$("#rt").textContent=mmss(rsec)},1e3);
 try{const st=await navigator.mediaDevices.getUserMedia({audio:true});mr=new MediaRecorder(st);chunks=[];mr.ondataavailable=e=>chunks.push(e.data);mr.onstop=()=>{st.getTracks().forEach(t=>t.stop());if(recording&&recording.send)push(conv(cur),{kind:"audio",dur:Math.max(1,rsec),url:URL.createObjectURL(new Blob(chunks,{type:mr.mimeType})),text:""});recording=null};mr.start();recording={fake:false}}
 catch{toast("Microfone indisponível: áudio simulado")}}
function stopRec(cancel){clearInterval(rtm);$("#comp").classList.remove("rc");$("#send").classList.remove("rec");btn();const r=recording;if(!r)return;if(r.fake){recording=null;if(!cancel)push(conv(cur),{kind:"audio",dur:Math.max(1,rsec),text:""})}else{recording={send:!cancel};mr.stop()}}
$("#rx").onclick=()=>stopRec(true);

 setTimeout(()=>{if(m.st==="sent"){m.st="deliv";upd(c)}},700);if(!ps.length)return;
 setTimeout(()=>{c.msgs.forEach(x=>{if(x.from===ME&&x.st!=="read")x.st="read"});upd(c)},1700);
 const who=ps[Math.floor(Math.random()*ps.length)];setTimeout(()=>{typing[c.id]=who;upd(c)},2400);
 setTimeout(()=>{delete typing[c.id];c.msgs.push({id:uid(),from:who,t:Date.now(),kind:"text",react:{},st:"read",text:REPL[Math.floor(Math.random()*REPL.length)]});if(cur===c.id)renderMsgs();else{c.unread++;banner(c,c.msgs[c.msgs.length-1])}save();upd(c)},4300)}

  function openMediaDb() {
    return new Promise((resolve, reject) => {
      if (!window.indexedDB) return reject(Error("IndexedDB não disponível"));
      const request = indexedDB.open(MEDIA_DB, 1);
      request.onupgradeneeded = () => {
        const database = request.result;
        if (!database.objectStoreNames.contains("files")) database.createObjectStore("files");
      };
      request.onerror = () => reject(request.error);
      request.onsuccess = () => resolve(request.result);
    });
  }

  async function storeMedia(id, file) {

    return new Promise((resolve, reject) => {
      const tx = db.transaction("files", "readwrite");
      tx.objectStore("files").put(file, id);
      tx.oncomplete = () => {db.close(); resolve(id);};
      tx.onerror = () => {db.close(); reject(tx.error);};
    });
  }

  async function loadMedia(id) {
    if (mediaCache.has(id)) return mediaCache.get(id);
    const db = await openMediaDb();
    return new Promise((resolve, reject) => {
      const tx = db.transaction("files", "readonly");
      const request = tx.objectStore("files").get(id);
      request.onsuccess = () => {db.close(); mediaCache.set(id, request.result); resolve(request.result);};
      request.onerror = () => {db.close(); reject(request.error);};
    });
  }

  }

  async function mountPersistedMedia() {

    for (const node of root.querySelectorAll("[data-media-object]")) {
      const key = node.dataset.mediaObject;

      if (node.dataset.ready) continue;
      node.dataset.ready = "1";
      try {
        const blob = await loadMedia(id);
        if (!blob || cur !== currentId || !node.isConnected) continue;
        node.src = objectUrl(id, blob);
      } catch (error) {
        node.dataset.ready = "";
      }
    }
  }

  function cropFile(file, onDone) {

    if (file.size > 25 * 1024 * 1024) return toast("Imagem grande demais");
    const image = new Image();
    const url = URL.createObjectURL(file);
    cropCallback = onDone;
    image.onload = () => {
      URL.revokeObjectURL(url);
      cropState = {image, zoom: 1, dx: 0, dy: 0, pointer: null};

    image.onerror = () => {URL.revokeObjectURL(url); toast("Não foi possível abrir a imagem");};

  function drawCropEditor() {
    sheet(`<h2>Editar imagem</h2>
      <div class="crop-preview" id="cropBox"><canvas id="cropCanvas" width="500" height="500"></canvas><span class="crop-overlay"></span></div>
      <div class="ranges"><span>−</span><input id="cropZoom" type="range" min="1" max="3" step="0.02" value="${cropState.zoom}" aria-label="Zoom"><span>＋</span></div>
      <div class="inline-actions"><button class="btn" data-crop-reset>Centralizar</button><button class="btn main" data-crop-save>Salvar imagem</button></div>`);
    cropCanvas = $("#cropCanvas");
    cropInput = $("#cropZoom");
    cropInput.oninput = event => {
      cropState.zoom = +event.target.value;
      paintCrop();
    };
    cropCanvas.addEventListener("pointerdown", event => {
      cropState.pointer = {id: event.pointerId, x: event.clientX, y: event.clientY, dx: cropState.dx, dy: cropState.dy};
      cropCanvas.setPointerCapture(event.pointerId);
    });
    cropCanvas.addEventListener("pointermove", event => {
      const pointer = cropState.pointer;
      if (!pointer || pointer.id !== event.pointerId) return;
      const scale = 500 / cropCanvas.getBoundingClientRect().width;
      cropState.dx = pointer.dx + (event.clientX - pointer.x) * scale;
      cropState.dy = pointer.dy + (event.clientY - pointer.y) * scale;
      paintCrop();
    });
    cropCanvas.addEventListener("pointerup", () => cropState.pointer = null);
    cropCanvas.addEventListener("pointercancel", () => cropState.pointer = null);
    paintCrop();
    $("#shBox").onclick = event => {
      if (event.target.closest("[data-crop-reset]")) {
        cropState.zoom = 1;
        cropState.dx = 0;
        cropState.dy = 0;
        cropInput.value = "1";
        paintCrop();
      }
      if (event.target.closest("[data-crop-save]")) {
        const result = document.createElement("canvas");
        result.width = result.height = 280;
        const context = result.getContext("2d");
        context.drawImage(cropCanvas, 0, 0, result.width, result.height);
        const data = result.toDataURL("image/jpeg", 0.78);
        sh.close();
        cropCallback?.(data);
      }
    };
  }

  function paintCrop() {
    if (!cropCanvas || !cropState) return;
    const {image, zoom, dx, dy} = cropState;
    const context = cropCanvas.getContext("2d", {alpha: false});
    const base = 500 / Math.min(image.naturalWidth, image.naturalHeight);
    const width = image.naturalWidth * base * zoom;
    const height = image.naturalHeight * base * zoom;
    context.fillStyle = "#15121b";
    context.fillRect(0, 0, 500, 500);
    context.drawImage(image, (500 - width) / 2 + dx, (500 - height) / 2 + dy, width, height);
  }

  // Todas as faixas oficiais de Unicode com apresentação emoji.
  // Seletor virtualizado por páginas, para evitar milhares de nós no smartphone.
  const EMOJI_SECTIONS = [
    ["rostos", "Rostos", 0x1F600, 0x1F64F],
    ["pessoas", "Pessoas", 0x1F466, 0x1F487],

  const SPECIAL_EMOJI = ["❤️", "♥️", "✉️", "☀️", "⭐", "✨", "☕", "⚡", "⚽", "⚖️", "🕊️", "✂️", "☔", "🌈", "🍀", "🫶", "🥹", "🫠", "🤍", "💜", "🩷", "🩵", "🖤", "👨‍👩‍👧", "👩‍❤️‍👩", "👨‍❤️‍👨", "👩‍💻", "👨‍🍳", "👩‍⚕️", "🏳️‍🌈", "🏴‍☠️", "🇧🇷", "🇵🇹", "🇺🇸", "🇯🇵", "🇰🇷", "1️⃣", "2️⃣", "3️⃣", "#️⃣", "*️⃣"];
  const EMOJI_ALIAS = {
    "coração": ["❤️", "💜", "🩷", "💙", "💚", "💛", "💔", "🫶"],
    "amor": ["❤️", "😍", "🥰", "😘", "🫶", "💌"],
    "risada": ["😂", "🤣", "😆", "😹"],

  };
  const emojiRegex = /\p{Extended_Pictographic}|\p{Emoji_Presentation}/u;
  const emojiGroups = new Map();
  const uniqueEmoji = new Set(SPECIAL_EMOJI);
  for (const [name, label, first, last] of EMOJI_SECTIONS) {
    const entries = [];
    for (let point = first; point <= last; point++) {
      const symbol = String.fromCodePoint(point);
      if (emojiRegex.test(symbol)) {
        entries.push(symbol);
        uniqueEmoji.add(symbol);
      }

    emojiGroups.set(name, {label, entries});
  }
  const allEmoji = [...uniqueEmoji];
  const originalFillGrid = fillGrid;
  fillGrid = function fullEmojiGrid(kind) {

  function renderEmojiPicker() {

    const requested = emojiQuery.trim().toLocaleLowerCase("pt-BR");
    const aliases = [...new Set(Object.entries(EMOJI_ALIAS).filter(([key]) => key.includes(requested)).flatMap(([,items]) => items))];
    const values = requested ? [...new Set([...aliases, ...available.filter(x => x.includes(requested))])] : available;

    const options = `<div class="sticker-toolbar" style="grid-column:1/-1">${[["todos", "Todos"], ...[...emojiGroups].map(([key, val]) => [key, val.label])].map(([key, label]) => `<button class="chip-sm ${key === currentEmojiCategory ? "on" : ""}" data-emoji-group="${key}">${label}</button>`).join("")}</div>`;

  function makeSticker(file) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      const url = URL.createObjectURL(file);
      img.onload = () => {
        URL.revokeObjectURL(url);
        const canvas = document.createElement("canvas");
        canvas.width = canvas.height = 256;
        const ctx = canvas.getContext("2d");
        ctx.clearRect(0, 0, 256, 256);
        const fit = Math.min(240 / img.width, 240 / img.height, 1);
        const width = img.width * fit;
        const height = img.height * fit;
        ctx.drawImage(img, (256 - width) / 2, (256 - height) / 2, width, height);
        const data = canvas.toDataURL("image/webp", .67);
        if (data.length > 300000) reject(Error("Sticker demasiado grande"));
        else resolve(data);
      };
      img.onerror = () => {URL.revokeObjectURL(url); reject(Error("Imagem inválida"));};
      img.src = url;
    });
  }

  function chooseOpponent(selected = "", mode = "ttt") {

  function newTtt(opponent) {
    return {
      status: "invited", invitation: opponent,
      board: Array(9).fill(""),
      turn: "X", scores: {X: 0, O: 0, draw: 0},
      winner: "", winning: [], rounds: 0,
      updated: Date.now(), created: Date.now()
    };
  }

  function tttOutcome(board) {
    const combinations = [
      [0, 1, 2], [3, 4, 5], [6, 7, 8],
      [0, 3, 6], [1, 4, 7], [2, 5, 8],
      [0, 4, 8], [2, 4, 6]
    ];
    for (const cells of combinations) {
      const [first, second, third] = cells;
      if (board[first] && board[first] === board[second] && board[first] === board[third]) {
        return {winner: board[first], cells};
      }
    }
    return board.every(Boolean) ? {winner: "draw", cells: []} : null;
  }

  function tttMove(game, index, actor) {
    if (game.status !== "active" || game.turn !== actor || game.board[index]) return false;
    game.board[index] = actor;
    const result = tttOutcome(game.board);
    if (result) {
      game.status = "finished";
      game.winner = result.winner;
      game.winning = result.cells;
      game.scores[result.winner] = (game.scores[result.winner] || 0) + 1;
      game.rounds++;
    } else game.turn = actor === "X" ? "O" : "X";
    game.updated = Date.now();
    persistGame();
    return true;
  }

  function bestTttMove(board) {
    const empty = board.flatMap((value, index) => value ? [] : [index]);
    for (const symbol of ["O", "X"]) {
      for (const index of empty) {
        const hypothetical = board.slice();
        hypothetical[index] = symbol;
        if (tttOutcome(hypothetical)?.winner === symbol) return index;
      }
    }
    if (empty.includes(4)) return 4;
    const priority = [0, 2, 6, 8, 1, 3, 5, 7];
    return priority.find(index => empty.includes(index)) ?? -1;
  }

      const cell = event.target.closest("[data-ttt-cell]");

            if (!conv(c.id)?.games || conv(c.id).games.ttt !== game || game.status !== "active") return;

      if (event.target.closest("[data-ttt-next]")) {

      if (event.target.closest("[data-ttt-reinvite]")) makeTttInvite();
    });
  }

  // ------------------ GARTIC ------------------
  // Vocabulário retirado do migration/20261102_gartic_clean_catalog.sql.
  // A lista local não depende de consultas remotas nem expõe credenciais.
  function createGartic(opponent, category, duration = 75) {
    return {
      status: "invited",
      invitation: opponent,
      members: [ME, opponent],
      scores: {[ME]: 0, [opponent]: 0},
      category,
      duration,
      cycles: 2,
      round: 0,
      mode: "draw",
      word: "",
      started: 0,
      ends: 0,
      revealed: [],
      solved: false,
      winner: "",
      strokes: [],
      messages: [],
      zoom: 1,
      drawingTime: 0
    };
  }

  function selectGarticWord(category, previous = "") {
    const words = GARTIC_WORDS[category] || GARTIC_WORDS.animais || ["gato"];
    const candidates = words.filter(word => word !== previous);
    return candidates[Math.floor(Math.random() * candidates.length)] || words[0];
  }

  function startGarticRound(game, mode = "draw") {
    game.status = "active";
    game.mode = mode;
    game.round += 1;
    game.word = selectGarticWord(game.category, game.word);
    game.started = Date.now();
    game.ends = game.started + game.duration * 1000;
    game.strokes = [];
    game.revealed = [];
    game.solved = false;
    game.winner = "";
    game.zoom = 1;
    game.messages.push({id: uid(), author: "Sistema", text: `Rodada ${game.round} iniciada`, t: Date.now()});
    game.messages = game.messages.slice(-80);
    persistGame();
  }

  function garticMaskedWord(game) {
    if (game.mode === "draw") return game.word;
    return Array.from(game.word).map((char, index) => {
      if (/\s/.test(char)) return " ";
      if (!/[a-záàâãéêíóôõúüç]/i.test(char)) return char;
      return game.revealed.includes(index) ? char : "_";
    }).join(" ");
  }

  function normalizedGarticGuess(game, guess) {
    return normalizedGuess(game.word) === normalizedGuess(guess);
  }

  function currentGartic() {
    return cur ? gameFor(conv(cur), "gartic") : null;
  }

  function garticRemaining(game) {
    return Math.max(0, Math.ceil((game.ends - Date.now()) / 1000));
  }

  function garticResult(game, won = false) {
    if (game.status !== "active") return;
    game.status = "finished";
    game.winner = won ? "guessed" : "time";
    if (won) {
      const points = Math.max(25, Math.ceil(garticRemaining(game) * 2));
      game.scores[ME] = (game.scores[ME] || 0) + points;
      game.messages.push({id: uid(), author: "Sistema", text: `Palavra descoberta · +${points} pontos`, t: Date.now()});
    } else {
      game.messages.push({id: uid(), author: "Sistema", text: `Tempo encerrado. Palavra: ${game.word}`, t: Date.now()});
    }
    persistGame();
    stopGameClock();
    if (cur) gameSystem(conv(cur), `Gartic · ${won ? "palavra descoberta" : "tempo encerrado"}`);
    if (sh.open && currentGame === "Gartic") openGartic();
  }

  function garticHint(game) {
    const eligible = Array.from(game.word).map((char, index) => ({char, index})).filter(item => /[a-záàâãéêíóôõúüç]/i.test(item.char) && !game.revealed.includes(item.index));
    if (!eligible.length) return toast("Todas as letras já foram reveladas");
    const item = eligible[Math.floor(Math.random() * eligible.length)];
    game.revealed.push(item.index);
    game.messages.push({id: uid(), author: "Dica", text: `Letra revelada: ${item.char.toUpperCase()}`, t: Date.now()});
    persistGame();
    openGartic();
  }

  function garticChatLine(author, text, success = false) {
    return `<div class="gartic-chat-line ${success ? "success" : ""}"><b>${esc(author)}:</b> ${esc(text)}</div>`;

  function drawGarticCanvas(game) {
    const canvas = $("#garticCanvas");
    if (!canvas) return;
    garticCanvas = canvas;
    const context = canvas.getContext("2d", {alpha: false});
    garticContext = context;
    context.setTransform(1, 0, 0, 1, 0, 0);
    context.fillStyle = "white";
    context.fillRect(0, 0, canvas.width, canvas.height);
    context.translate(canvas.width / 2, canvas.height / 2);
    context.scale(game.zoom || 1, game.zoom || 1);
    context.translate(-canvas.width / 2, -canvas.height / 2);
    context.lineCap = "round";
    context.lineJoin = "round";
    for (const stroke of game.strokes || []) {
      if (!stroke.points?.length) continue;
      context.strokeStyle = stroke.color || "#292437";
      context.lineWidth = stroke.size || 4;
      context.beginPath();
      for (const [index, point] of stroke.points.entries()) {
        const x = point[0] * canvas.width;
        const y = point[1] * canvas.height;
        if (!index) context.moveTo(x, y);
        else context.lineTo(x, y);
      }
      if (stroke.points.length === 1) {
        const [x, y] = stroke.points[0];
        context.lineTo(x * canvas.width + .1, y * canvas.height + .1);
      }
      context.stroke();
    }
  }

  function canvasCoords(event, game) {
    const canvas = garticCanvas;
    const box = canvas.getBoundingClientRect();
    const scale = game.zoom || 1;
    const px = (event.clientX - box.left) / box.width;
    const py = (event.clientY - box.top) / box.height;
    return [Math.max(0, Math.min(1, (px - .5) / scale + .5)), Math.max(0, Math.min(1, (py - .5) / scale + .5))];
  }

  function installCanvasInput(game) {
    if (!garticCanvas) return;
    const canDraw = game.mode === "draw" && game.status === "active";
    let pointers = new Map();
    let pinching = 0;
    garticCanvas.style.cursor = canDraw ? "crosshair" : "default";
    const begin = event => {
      pointers.set(event.pointerId, [event.clientX, event.clientY]);
      garticCanvas.setPointerCapture(event.pointerId);
      if (pointers.size > 1) {
        garticIsDrawing = false;
        pinching = pointerDistance(pointers);
        return;
      }
      if (!canDraw) return;
      if (game.strokes.length >= 340) {
        game.strokes.splice(0, 40);
      }
      garticIsDrawing = true;
      game.strokes.push({color: garticBrush, size: garticBrushSize, points: [canvasCoords(event, game)]});
      drawGarticCanvas(game);
    };
    const move = event => {
      if (!pointers.has(event.pointerId)) return;
      pointers.set(event.pointerId, [event.clientX, event.clientY]);
      if (pointers.size > 1) {
        const distance = pointerDistance(pointers);
        if (pinching > 0) game.zoom = Math.min(3, Math.max(1, game.zoom * distance / pinching));
        pinching = distance;
        $("#garticZoom").value = game.zoom;
        drawGarticCanvas(game);
        return;
      }
      if (!canDraw || !garticIsDrawing) return;
      const stroke = game.strokes[game.strokes.length - 1];
      if (!stroke || stroke.points.length >= 300) return;
      stroke.points.push(canvasCoords(event, game));
      drawGarticCanvas(game);
    };
    const end = event => {
      if (pointers.has(event.pointerId)) pointers.delete(event.pointerId);
      if (!pointers.size) pinching = 0;
      if (garticIsDrawing) {
        garticIsDrawing = false;
        persistGame();
      }
    };
    garticCanvas.onpointerdown = begin;
    garticCanvas.onpointermove = move;
    garticCanvas.onpointerup = end;
    garticCanvas.onpointercancel = end;
  }

  function pointerDistance(pointers) {
    const list = [...pointers.values()];
    if (list.length < 2) return 0;
    return Math.hypot(list[0][0] - list[1][0], list[0][1] - list[1][1]);
  }

  function garticBotDrawing(game) {
    if (game.mode !== "guess" || game.strokes.length) return;
    const seed = Array.from(game.word).reduce((acc, ch) => acc * 29 + ch.charCodeAt(0), 71);
    for (let idx = 0; idx < 10; idx++) {
      const turn = (seed + idx * 31) / 57;
      const cx = .5 + Math.sin(turn) * .25;
      const cy = .5 + Math.cos(turn * .77) * .23;
      const points = [];
      for (let step = 0; step < 24; step++) {
        const angle = step / 23 * Math.PI * 2;
        points.push([Math.max(0, Math.min(1, cx + .04 * Math.cos(angle))), Math.max(0, Math.min(1, cy + .06 * Math.sin(angle)))]);
      }
      game.strokes.push({color: GAME_COLORS[idx % 6], size: 4, points});
    }
    persistGame();
  }

  function garticActiveMarkup(game) {
    const label = CATEGORIES.find(x => x[0] === game.category)?.[2] || game.category;
    const drawing = game.mode === "draw";
    const word = garticMaskedWord(game);
    const lines = (game.messages || []).slice(-45).map(item => garticChatLine(item.author, item.text, item.author === "Sistema" && item.text.includes("descoberta"))).join("");
    const tools = drawing ? `
      <div class="gartic-palette">${GAME_COLORS.map(color => `<button class="gartic-color ${garticBrush === color ? "on" : ""}" style="background:${color}" data-brush="${color}" aria-label="Cor ${color}"></button>`).join("")}
      <input id="garticSize" type="range" min="2" max="20" value="${garticBrushSize}" aria-label="Espessura do pincel" style="width:85px;accent-color:var(--primary)"></div>
      <div class="game-tools"><button data-gartic-undo>Desfazer</button><button data-gartic-clear>Apagar tudo</button><button data-gartic-mode="guess">Adivinhar (teste)</button></div>
    ` : `<div class="game-tools"><button data-gartic-hint>💡 Dica</button><button data-gartic-mode="draw">Desenhar (teste)</button></div>`;
    return `<div class="gartic-shell">
      <div class="game-meta"><span class="game-tag">${esc(label)}</span><span class="game-tag">${drawing ? "✏️ Você desenha" : "🔎 Você adivinha"}</span><span class="game-tag">Rodada ${game.round}</span></div>
      <div class="gartic-stats"><span>Tempo<b id="garticTime">${garticRemaining(game)}s</b></span><span>Seus pontos<b>${game.scores[ME] || 0}</b></span><span>Convidado<b>${game.scores[game.invitation] || 0}</b></span></div>
      <div class="gartic-word" aria-label="Palavra da rodada">${esc(word)}</div>
      <div class="gartic-canvas-wrap"><canvas id="garticCanvas" width="640" height="480" aria-label="Área de desenho"></canvas></div>
      <div class="ranges" style="margin:4px 0"><span style="font-size:11px">Zoom</span><input id="garticZoom" type="range" min="1" max="3" step="0.05" value="${game.zoom || 1}" aria-label="Zoom do desenho"></div>
      ${tools}
      <div class="gartic-score-list">${game.members.map(id => `<span>${esc(U(id).n)} · ${game.scores[id] || 0} pts</span>`).join("")}</div>
      <div class="gartic-chat" id="garticChat" aria-label="Chat do Gartic">${lines}</div>
      <form id="garticChatForm" class="gartic-guess"><input class="feature-input slim" name="text" maxlength="140" placeholder="${drawing ? "Mensagem para a partida" : "Digite seu palpite ou mensagem"}" autocomplete="off"><button class="btn main" type="submit">Enviar</button></form>
      <div class="game-tools"><button data-gartic-mic>🎙️ Microfone ${garticMicrophone ? "ON" : "OFF"}</button><button data-gartic-skip>Próxima rodada</button><button data-gartic-exit>Encerrar</button></div>
    </div>`;
  }

  function garticFinishMarkup(game) {
    return `<div class="game-invite">
      <span class="symbol-large">${game.winner === "guessed" ? "🏆" : "⏰"}</span>
      <h3>${game.winner === "guessed" ? "Palavra descoberta!" : "Rodada encerrada"}</h3>
      <p>A palavra era <strong>${esc(game.word)}</strong></p>
      <div class="gartic-score-list">${game.members.map(id => `<span>${esc(U(id).n)} · ${game.scores[id] || 0} pts</span>`).join("")}</div>
      <button class="btn main" data-gartic-next>Próxima rodada</button>
      <button class="btn" data-gartic-fresh>Nova partida</button>
    </div>`;
  }

  function openGartic() {
    stopGameClock();
    const c = conv(cur);
    const game = gameFor(c, "gartic");
    if (!game) return garticInvite();
    if (game.status === "invited") {
      gameModal("Gartic", `<div class="game-invite"><span class="symbol-large">🎨</span><h3>Convite enviado</h3><p>Para ${esc(U(game.invitation).n)}</p><p class="mobile-note">Aceitar representa a confirmação no modo de demonstração.</p><div class="inline-actions"><button class="btn main" data-gartic-accept>Aceitar convite</button><button class="btn" data-gartic-decline>Recusar</button></div></div>`, event => {
        if (event.target.closest("[data-gartic-accept]")) {
          game.status = "lobby";
          gameSystem(c, `Convite para Gartic aceito por ${U(game.invitation).n}`);
          openGartic();
        }
        if (event.target.closest("[data-gartic-decline]")) {
          game.status = "declined";
          gameSystem(c, "Convite para Gartic recusado");
          openGartic();
        }
      });
      return;
    }
    if (game.status === "declined" || game.status === "ended") {
      gameModal("Gartic", `<div class="game-invite"><span class="symbol-large">🎨</span><h3>Partida ${game.status === "declined" ? "recusada" : "encerrada"}</h3><button class="btn main" data-gartic-fresh>Nova partida</button></div>`, gameAction);
      return;
    }
    if (game.status === "lobby") {
      gameModal("Gartic", `<div class="game-invite"><span class="symbol-large">🎨</span><h3>Preparar partida</h3><div style="width:100%;text-align:left"><label for="garticCategory">Tema</label>${garticCategories(game.category)}<label for="garticDuration">Duração</label><select class="feature-input" id="garticDuration">${[45, 75, 90, 120].map(n => `<option value="${n}" ${n === game.duration ? "selected" : ""}>${n} segundos</option>`).join("")}</select></div><button class="btn main" data-gartic-start>Iniciar partida</button></div>`, gameAction);
      return;
    }
    if (game.status === "active" && Date.now() >= game.ends) {
      garticResult(game);
      return;
    }
    if (game.status === "active" && game.mode === "guess") garticBotDrawing(game);
    gameModal("Gartic", game.status === "active" ? garticActiveMarkup(game) : garticFinishMarkup(game), gameAction);
    if (game.status !== "active") return;
    drawGarticCanvas(game);
    installCanvasInput(game);
    $("#garticChat").scrollTop = $("#garticChat").scrollHeight;
    const form = $("#garticChatForm");
    form.onsubmit = event => {
      event.preventDefault();
      const text = form.elements.text.value.trim();
      if (!text) return;
      if (text.length > 140) return toast("Mensagem muito longa");
      const correct = game.mode === "guess" && normalizedGarticGuess(game, text);
      game.messages.push({id: uid(), author: U(ME).n, text, t: Date.now()});
      game.messages = game.messages.slice(-80);
      persistGame();
      if (correct) return garticResult(game, true);
      const line = document.createElement("div");
      line.className = "gartic-chat-line";
      line.textContent = `${U(ME).n}: ${text}`;
      $("#garticChat")?.append(line);
      $("#garticChat").scrollTop = $("#garticChat").scrollHeight;
      form.reset();
    };
    $("#garticZoom").oninput = event => {
      game.zoom = +event.target.value;
      drawGarticCanvas(game);
    };
    $("#garticSize")?.addEventListener("input", event => garticBrushSize = +event.target.value);
    gameInterval = setInterval(() => {
      if (cur !== c.id || currentGame !== "Gartic" || !sh.open) return stopGameClock();
      const remaining = garticRemaining(game);
      const time = $("#garticTime");
      if (time) time.textContent = `${remaining}s`;
      if (remaining <= 0) garticResult(game);
    }, 500);
  }

  function gameAction(event) {
    const c = conv(cur);
    if (!c) return;
    const game = gameFor(c, "gartic");
    if (!game) return;
    const target = event.target;
    const brush = target.closest("[data-brush]");
    if (brush) {
      garticBrush = brush.dataset.brush;
      $$("[data-brush]").forEach(button => button.classList.toggle("on", button === brush));
      return;
    }
    if (target.closest("[data-gartic-start]")) {
      game.category = $("#garticCategory").value;
      game.duration = +$("#garticDuration").value;
      startGarticRound(game);
      gameSystem(c, "Gartic iniciado");
      openGartic();
      return;
    }
    if (target.closest("[data-gartic-next]")) {
      startGarticRound(game, game.mode === "draw" ? "guess" : "draw");
      openGartic();
      return;
    }
    if (target.closest("[data-gartic-fresh]")) {
      c.games.gartic = null;
      persistGame();
      garticInvite();
      return;
    }
    if (target.closest("[data-gartic-undo]")) {
      game.strokes.pop();
      persistGame();
      drawGarticCanvas(game);
      return;
    }
    if (target.closest("[data-gartic-clear]")) {
      game.strokes = [];
      persistGame();
      drawGarticCanvas(game);
      return;
    }
    if (target.closest("[data-gartic-hint]")) return garticHint(game);
    const mode = target.closest("[data-gartic-mode]");
    if (mode) {
      game.mode = mode.dataset.garticMode;
      game.strokes = [];
      game.zoom = 1;
      game.revealed = [];
      persistGame();
      openGartic();
      return;
    }
    if (target.closest("[data-gartic-skip]")) {
      garticResult(game);
      return;
    }
    if (target.closest("[data-gartic-exit]")) {
      game.status = "ended";
      persistGame();
      stopGameMicrophone();
      stopGameClock();
      gameSystem(c, "Partida de Gartic encerrada");
      openGartic();
      return;
    }
    if (target.closest("[data-gartic-mic]")) {
      toggleGarticMicrophone();
    }
  }

  async function toggleGarticMicrophone() {
    if (garticMicrophone) {
      stopGameMicrophone();
      $("[data-gartic-mic]").textContent = "🎙️ Microfone OFF";
      toast("Microfone desligado");
      return;
    }
    try {
      if (!navigator.mediaDevices?.getUserMedia) throw Error("unsupported");
      garticMicrophone = await navigator.mediaDevices.getUserMedia({audio: {echoCancellation: true, noiseSuppression: true}});
      $("[data-gartic-mic]").textContent = "🎙️ Microfone ON";
      toast("Captura de microfone ativa neste dispositivo");
    } catch {
      toast("Microfone indisponível ou permissão negada");
    }
  }

  // Fecha microfone e relógios quando a janela modal é dispensada.
  sh.addEventListener("close", () => {
    if (gameInDialog) {
      stopGameClock();
      stopGameMicrophone();
      gameInDialog = false;
      currentGame = "";
    }
  });

  // Alternar aba/navegação não deve deixar áudio ou timers de jogo pendentes.
  const originalCloseConv = closeConv;
  closeConv = function enhancedCloseConv() {
    stopGameClock();
    stopGameMicrophone();
    if (sh.open) sh.close();
    originalCloseConv();
  };

  // Mensagens de jogos: links para reabrir partida mesmo após sair da modal.
  const originalRenderGameMessages = renderMsgs;
  renderMsgs = function renderGameMessages(jump = false) {
    originalRenderGameMessages(jump);
    for (const node of $("#msgs").querySelectorAll(".sysm")) {
      if (/Gartic|Jogo da Velha/i.test(node.textContent)) {
        node.style.cursor = "pointer";
        node.title = "Abrir Games";
        node.onclick = () => openGames();
      }
    }
  };

  // Atualiza avatares de grupos após gerar a lista de conversas.
  const originalRefresh = refresh;
  refresh = function enhancedRefresh() {
    originalRefresh();
    applyGroupPhotoNodes();
  };

  // Feedback de conexão real, sem fabricar vídeo ou chamadas remotas no modelo.
  const originalStartCall = startCall;
  startCall = function annotatedStartCall(video) {
    originalStartCall(video);
    const status = $("#cst");
    if (status) status.textContent = video ? "Simulação de videochamada" : "Simulação de chamada";
  };

  // Recupera preferência de tema salva por este HTML.
  const savedTheme = localStorage.getItem(THEME_KEY);
  if (savedTheme === "dark" || savedTheme === "light") {
    document.documentElement.dataset.theme = savedTheme;
  }
  $("#menu").addEventListener("click", event => {
    if (event.target.closest('[data-m="theme"]')) {
      localStorage.setItem(THEME_KEY, document.documentElement.dataset.theme || "light");
    }
  });

  // Corrige bug do viewport: não força rolagem ao fundo quando teclado aparece.
  if (window.visualViewport) {
    const adjustKeyboard = () => {
      const viewport = window.visualViewport;
      const visible = Math.max(300, viewport.height);
      $("#conv").style.height = `${visible}px`;
      $("#conv").style.top = `${Math.max(0, viewport.offsetTop)}px`;
    };
    viewportCleanup();
    window.visualViewport.addEventListener("resize", adjustKeyboard, {passive: true});
    window.visualViewport.addEventListener("scroll", adjustKeyboard, {passive: true});
    adjustKeyboard();
  }

  function viewportCleanup() {
    // Não remove o event handler original; a revisão abaixo preserva o scroll
    // capturando a posição anterior para as mensagens antigas.
    const content = $("#msgs");
    let storedTop = 0;
    let lastHeight = content.clientHeight;
    content.addEventListener("scroll", () => {
      storedTop = content.scrollTop;
    }, {passive: true});
    if (typeof ResizeObserver === "function") {
      new ResizeObserver(() => {
        if (!cur) return;
        const delta = lastHeight - content.clientHeight;
        lastHeight = content.clientHeight;
        if (Math.abs(delta) < 30) return;
        const distance = content.scrollHeight - (storedTop + content.clientHeight);
        if (distance > 220) content.scrollTop = storedTop;
      }).observe(content);
    }
  }

  // Gravação real somente quando a API está disponível e a permissão foi concedida.
  // Nunca inventa um áudio caso o microfone seja bloqueado.
  let liveVoiceStream = null;
  let liveVoiceRecorder = null;
  let liveVoiceChunks = [];
  let liveVoiceStarted = 0;
  let liveVoiceConversation = null;
  startRec = async function beginRealVoiceRecording() {
    if (!cur || recording) return;
    if (conv(cur)?.blocked) return toast("Conversa bloqueada");
    let stream;
    try {
      if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) {
        throw Error("O navegador não oferece gravação de áudio");
      }
      stream = await navigator.mediaDevices.getUserMedia({audio: {echoCancellation: true, noiseSuppression: true}});
      const formats = ["audio/webm;codecs=opus", "audio/mp4", "audio/webm"];
      const mimeType = formats.find(type => MediaRecorder.isTypeSupported(type)) || "";
      liveVoiceRecorder = mimeType ? new MediaRecorder(stream, {mimeType}) : new MediaRecorder(stream);
      liveVoiceStream = stream;
      liveVoiceChunks = [];
      liveVoiceConversation = cur;
      liveVoiceStarted = Date.now();
      liveVoiceRecorder.addEventListener("dataavailable", event => {
        if (event.data?.size > 0) liveVoiceChunks.push(event.data);
      });
      liveVoiceRecorder.start(250);
      recording = {real: true};
      rsec = 0;
      $("#rt").textContent = "00:00";
      $("#comp").classList.add("rc");
      $("#send").classList.add("rec");
      $("#send").innerHTML = ic("send");
      clearInterval(rtm);
      rtm = setInterval(() => {
        rsec = Math.ceil((Date.now() - liveVoiceStarted) / 1000);
        $("#rt").textContent = mmss(rsec);
        if (rsec >= 180) stopRec(false);
      }, 300);
    } catch (error) {
      stream?.getTracks().forEach(track => track.stop());
      liveVoiceRecorder = null;
      liveVoiceStream = null;
      recording = null;
      toast(error?.name === "NotAllowedError" ? "Permissão do microfone negada" : "Não foi possível acessar o microfone");
    }
  };

  stopRec = function endRealVoiceRecording(cancel) {
    if (!recording || !liveVoiceRecorder) return;
    const recorder = liveVoiceRecorder;
    const stream = liveVoiceStream;
    const conversationId = liveVoiceConversation;
    const duration = Math.max(1, Math.ceil((Date.now() - liveVoiceStarted) / 1000));
    clearInterval(rtm);
    $("#comp").classList.remove("rc");
    $("#send").classList.remove("rec");
    recording = null;
    btn();
    recorder.addEventListener("stop", async () => {
      stream?.getTracks().forEach(track => track.stop());
      if (cancel || !liveVoiceChunks.length) return;
      const file = new Blob(liveVoiceChunks, {type: recorder.mimeType || "audio/webm"});
      const conversation = conv(conversationId);
      if (!file.size || !conversation) return;
      const url = objectUrl(`voice-${uid()}`, file);
      push(conversation, {kind: "audio", text: "", dur: duration, url, size: file.size});
      const message = conversation.msgs[conversation.msgs.length - 1];
      if (message) {
        try {
          await storeMedia(message.id, file);
          mediaCache.set(message.id, file);
        } catch {
          toast("Áudio disponível apenas nesta sessão");
        }
      }
    }, {once: true});
    if (recorder.state !== "inactive") recorder.stop();
    else stream?.getTracks().forEach(track => track.stop());
    liveVoiceRecorder = null;
    liveVoiceStream = null;
  };

  // Reprodução baseada na duração real do arquivo; barra e arraste sincronizados.
  const basePlayAudio = playAudio;
  playAudio = async function playRecordedVoice(element) {
    const id = element.dataset.au;
    const message = conv(cur)?.msgs.find(m => m.id === id);
    if (!message) return;
    let blob = null;
    try {
      blob = await loadMedia(id);
    } catch {}
    if (!blob && (!message.url || !message.url.startsWith("blob:"))) {
      return basePlayAudio(element); // Áudios antigos do seed são demonstrativos.
    }
    const sound = new Audio(blob ? objectUrl(id, blob) : message.url);
    const bars = [...element.querySelectorAll(".wf i")];
    const button = element.querySelector("button");
    if (cA?.id === id) {
      cA.stop();
      return;
    }
    cA?.stop();
    const show = () => {
      const total = Number.isFinite(sound.duration) && sound.duration > 0 ? sound.duration : message.dur || 1;
      const ratio = Math.min(1, sound.currentTime / total);
      bars.forEach((bar, index) => bar.classList.toggle("p", index / bars.length <= ratio));
      const label = element.querySelector("small");
      if (label) label.textContent = mmss(Math.round(Math.max(0, total - sound.currentTime)));
    };
    const stop = () => {
      sound.pause();
      sound.currentTime = 0;
      button.innerHTML = ic("play", "f");
      bars.forEach(bar => bar.classList.remove("p"));
      if (cA?.id === id) cA = null;
    };
    cA = {id, stop};
    sound.addEventListener("timeupdate", show);
    sound.addEventListener("loadedmetadata", show);
    sound.addEventListener("ended", stop, {once: true});
    sound.addEventListener("error", () => {stop();toast("Áudio indisponível");}, {once: true});
    const wave = element.querySelector(".wf");
    wave.style.touchAction = "pan-y";
    wave.onclick = event => {
      const bounds = wave.getBoundingClientRect();
      if (Number.isFinite(sound.duration)) {
        sound.currentTime = Math.max(0, Math.min(1, (event.clientX - bounds.left) / bounds.width)) * sound.duration;
        show();
      }
    };
    button.innerHTML = ic("pause");
    try {
      await sound.play();
    } catch {
      stop();
      toast("Toque novamente para reproduzir áudio");
    }
  };

  // Carregamento inicial do novo catálogo e seu vínculo com a interface existente.
  fillGrid("e");
  refresh();
  console.info("Looply Chat modelo completo: games, 141+ stickers, grupos, anexos, perfil e ferramentas locais preparados.");
})();

</script>
<script>
/*
 * Looply Ultra — terceira camada de aprimoramento incremental.
 * O projeto continua um MODELO LOCAL: não afirma conexão remota.
 * Nenhuma mensagem existente é removida ou convertida por esta camada.
 * Arquivos da galeria e fundos são armazenados no IndexedDB do aparelho.
 */
(() => {
  "use strict";
  const REVISION = "3.0.0";
  const NOTIFICATIONS_KEY = "looply-ultra-activity-v3";
  const DRAFTS_KEY = "looply-ultra-drafts-v3";
  const PREF_KEY = "looply-ultra-preferences-v3";
  const MEDIA_DATABASE = "looply-model-media-v2";
  const MAX_ACTIVITY = 160;
  const $u = (selector, root = document) => root.querySelector(selector);
  const $$u = (selector, root = document) => [...root.querySelectorAll(selector)];
  const safeJson = (key, fallback) => {
    try {
      return JSON.parse(localStorage.getItem(key) || "null") ?? fallback;
    } catch {
      return fallback;

  // Fundo personalizado — armazena o Blob em IndexedDB, nunca no localStorage.
  function withMediaDatabase(mode,runner) {
    return new Promise((resolve,reject)=>{
      if(!indexedDB) return reject(new Error("IndexedDB indisponível"));
      const req=indexedDB.open(MEDIA_DATABASE,1);
      req.onupgradeneeded=()=>{
        const db=req.result;
        if(!db.objectStoreNames.contains("files")) db.createObjectStore("files");
      };
      req.onerror=()=>reject(req.error);
      req.onsuccess=()=>{
        const db=req.result;
        let value=null;
        let tx;
        try {
          tx=db.transaction("files",mode);
          const request=runner(tx.objectStore("files"));
          if(request) {
            request.onsuccess=()=>value=request.result;
            request.onerror=()=>reject(request.error);
          }
          tx.oncomplete=()=>{db.close();resolve(value);};
          tx.onerror=()=>{db.close();reject(tx.error);};
        }catch(error){db.close();reject(error);}
      };
    });
  }
  const saveBlob=(key,blob)=>withMediaDatabase("readwrite",store=>store.put(blob,key));
  const getBlob=(key)=>withMediaDatabase("readonly",store=>store.get(key));
  const dropBlob=(key)=>withMediaDatabase("readwrite",store=>store.delete(key));
  // Fallback para previews em contextos que bloqueiam IndexedDB (ex.: about:blank).
  async function storeWallpaperBlob(key,blob) {
    try {
      await saveBlob(key,blob);
      try {localStorage.removeItem(`ultra-fallback:${key}`);}catch {}
      return;
    } catch {
      const data=await new Promise((resolve,reject)=>{
        const reader=new FileReader();
        reader.onload=()=>resolve(reader.result);
        reader.onerror=()=>reject(reader.error);
        reader.readAsDataURL(blob);
      });
      if(data.length>1100000)throw new Error("Foto grande demais para este navegador");
      localStorage.setItem(`ultra-fallback:${key}`,data);
    }
  }
  async function loadWallpaperBlob(key) {
    try {
      const blob=await getBlob(key);
      if(blob)return blob;
    }catch {}
    const data=localStorage.getItem(`ultra-fallback:${key}`);
    if(!data)return null;
    const match=/^data:([^;]+);base64,(.+)$/i.exec(data);
    if(!match)return null;
    const decoded=atob(match[2]);
    const bytes=new Uint8Array(decoded.length);
    for(let i=0;i<decoded.length;i++)bytes[i]=decoded.charCodeAt(i);
    return new Blob([bytes],{type:match[1]});
  }
  async function makeSmallBackground(file) {
    if(!file?.type.startsWith("image/")) throw new Error("Escolha uma foto");
    if(file.size>25*1024*1024) throw new Error("A foto deve ter até 25 MB");
    const bitmap=await createImageBitmap(file);
    const scale=Math.min(1,1440/Math.max(bitmap.width,bitmap.height));
    const canvas=document.createElement("canvas");
    canvas.width=Math.max(1,Math.round(bitmap.width*scale));
    canvas.height=Math.max(1,Math.round(bitmap.height*scale));
    const context=canvas.getContext("2d");
    context.drawImage(bitmap,0,0,canvas.width,canvas.height);
    bitmap.close();
    return await new Promise((resolve,reject)=>canvas.toBlob(blob=>blob?.type==="image/webp"?resolve(blob):reject(new Error("Este aparelho não conseguiu gerar uma imagem WebP")),"image/webp",.83));
  }

  // Chamadas demonstrativas: linha de eventos com estados distintos.
  function stopActiveCall({missed=false,declined=false}={}) {
    const call=currentCall;
    if(!call) return;
    currentCall=null;
    clearTimeout(call.connectTimer);
    clearTimeout(call.missedTimer);
    clearInterval(call.clockTimer);
    call.media?.getTracks().forEach(track=>track.stop());
    const screen=$u("#call");
    screen.hidden=true;
    screen.innerHTML="";
    const c=conv(call.conversationId);
    if(!c) return;
    const time=Math.max(0,Math.round((Date.now()-call.connectedAt)/1000));
    const type=call.video?"vídeo":"voz";
    let description;
    if(declined) description=`📵 Chamada de ${type} recusada`;
    else if(missed) description=`📵 Chamada de ${type} perdida`;
    else if(!call.connectedAt) description=`${call.video?"📹":"📞"} Chamada de ${type} cancelada`;
    else description=`${call.video?"📹":"📞"} Chamada de ${type} · ${mmss(time)}`;
    c.msgs.push({id:uid(),from:"sys",t:Date.now(),kind:"sys",text:description});
    createActivity({kind:missed?"missed":call.video?"video":"audio",conversationId:c.id,from:call.incoming?call.from:ME,body:description,outgoing:!call.incoming,seen:!call.incoming});
    if(call.incoming && cur!==c.id) c.unread=(c.unread||0)+1;
    save();
    refresh();
    if(cur===c.id) renderMsgs();
  }

  function beginCallTimer() {

  async function toggleSelfCamera() {
    const call=currentCall;
    if(!call||!call.video) return;
    if(call.media) {
      call.media.getTracks().forEach(track=>track.stop());
      call.media=null;
      $u("#selfCamera").innerHTML="<span>Câmera desligada</span>";
      $u("#cCam").classList.remove("on");
      return;
    }
    try {
      if(!navigator.mediaDevices?.getUserMedia)throw new Error("Câmera indisponível");
      const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user"},audio:false});
      if(currentCall!==call){stream.getTracks().forEach(track=>track.stop());return;}
      call.media=stream;
      const area=$u("#selfCamera");
      area.innerHTML='<video autoplay muted playsinline></video><span>Você</span>';

  function setupSwipeReply() {
    const root=$u("#msgs");
    let beginning=null;
    root.addEventListener("pointerdown",event=>{
      const row=event.target.closest(".m[data-id]");
      if(!row||event.target.closest("button,input,textarea,a,video"))return;
      beginning={id:row.dataset.id,x:event.clientX,y:event.clientY,time:Date.now(),row};
    },{passive:true});
    root.addEventListener("pointermove",event=>{
      if(!beginning)return;
      const dx=event.clientX-beginning.x;
      const dy=event.clientY-beginning.y;
      if(Math.abs(dy)>35){beginning=null;return;}
      if(dx>8 && dx<96 && Math.abs(dy)<20){
        beginning.row.classList.add("message-swiping");
        beginning.row.style.transform=`translateX(${Math.min(dx,85)*.45}px)`;
      }
    },{passive:true});
    const finish=event=>{
      if(!beginning)return;
      const active=beginning;
      beginning=null;
      active.row.style.removeProperty("transform");
      active.row.classList.remove("message-swiping");
      const dx=event.clientX-active.x;
      const dy=event.clientY-active.y;
      if(dx<65||Math.abs(dy)>35)return;
      const m=findMessage(active.id);
      if(!m||m.del)return;
      reply=m;
      editing=null;
      ctx();
      inp.focus();
      if(preferences.vibrate&&navigator.vibrate)navigator.vibrate(9);
    };
    root.addEventListener("pointerup",finish,{passive:true});
    root.addEventListener("pointercancel",()=>{
      if(beginning){beginning.row.style.removeProperty("transform");beginning.row.classList.remove("message-swiping");}
      beginning=null;
    },{passive:true});
  }

      if(!event.target.closest('[data-enhanced-msg="pin"]'))return;
      const c=validConversation();
      if(c)createActivity({kind:"pinned",conversationId:c.id,from:ME,body:"Mensagem fixada ou desafixada",outgoing:true,seen:true});
    },true);
    const previousMenu=msgMenu;
    msgMenu=function ultraMessageMenu(id) {
      previousMenu(id);
      const m=findMessage(id);
      if(!m||!sh.open) return;
      const panel=$u("#shBox");
      const button=document.createElement("button");
      button.className="act";
      button.dataset.ultraDetails=id;
      button.innerHTML=ic("eye")+"Informações da mensagem";
      const anchor=panel.querySelector(".act.dg");
      if(anchor)anchor.before(button);
      panel.addEventListener("click",event=>{
        const more=event.target.closest("[data-ultra-details]");
        if(!more)return;
        event.stopImmediatePropagation();
        showMessageDetails(m);
      },{capture:true,once:false});
    };
    $u("#shBox").addEventListener("click",event=>{
      if(!event.target.closest('[data-d="all"]'))return;
      const c=validConversation();
      if(!c)return;
      queueMicrotask(()=>createActivity({kind:"deletion",conversationId:c.id,from:ME,body:"Mensagem apagada para todos",outgoing:true,seen:true}));
    },true);
  }
  function showMessageDetails(m) {
    const read=m.st==="read";
    const delivered=m.st==="deliv"||read;
    sheet(`<h2>Informações</h2>
      <div class="feature-panel"><b>Mensagem</b><p>${esc(m.kind==="letter"?"💌 Carta selada":(m.text||m.kind||"Mensagem")).slice(0,350)}</p></div>
      <div class="feature-row"><span class="minicon">📤</span><span class="grow">Enviada<small>${esc(readable(m.t))}</small></span></div>
      <div class="feature-row"><span class="minicon">${delivered?"✓✓":"⌛"}</span><span class="grow">${delivered?"Entregue":"Aguardando confirmação de entrega"}</span></div>
      <div class="feature-row"><span class="minicon">${read?"💙":"○"}</span><span class="grow">${read?"Lida":"Ainda não lida"}</span></div>
      <button class="btn main" data-info-close>Fechar</button>
      `);
    $u("#shBox").onclick=event=>{if(event.target.closest("[data-info-close]"))sh.close();};
  }

  // Atalhos adicionais dentro da configuração sem substituir controles antigos.
  const drawBeforeUltra=cfgDraw;
  cfgDraw=function ultraCfgDraw() {
    drawBeforeUltra();
    const root=$u("#cfg .cwrap");
    if(!root)return;
    root.insertAdjacentHTML("beforeend",`
      <h6>Experiência Premium</h6>
      <button class="crow" data-ultra-setting="wallpaper"><span class="ci">🖼️</span><span class="ct"><b>Foto e papel de parede</b><small>Escolher imagem da galeria ou uma cor</small></span></button>
      <button class="crow" data-ultra-setting="activity"><span class="ci">🔔</span><span class="ct"><b>Histórico de atividades</b><small>Chamadas, mensagens, cartas e avisos</small></span></button>
      <button class="crow" data-ultra-setting="letter"><span class="ci">💌</span><span class="ct"><b>Enviar carta</b><small>Envelope lacrado, selo e papel personalizado</small></span></button>
      `);
  };
  function setupSettingsActions() {
    $u("#cfg").addEventListener("click",event=>{
      const target=event.target.closest("[data-ultra-setting]");
      if(!target || target.dataset.ultraSetting==="wallpaper")return;
      event.preventDefault();
      event.stopImmediatePropagation();
      cfgClose();
      if(target.dataset.ultraSetting==="activity")showActivityCenter();
      if(target.dataset.ultraSetting==="letter")showLetterEditor();
      if(target.dataset.ultraSetting==="incoming")simulateEventSelector();
    },true);
  }
  function setupShortcuts() {
    document.addEventListener("keydown",event=>{
      if(event.key.toLowerCase()==="k"&&(event.ctrlKey||event.metaKey)&&!event.shiftKey){
        event.preventDefault();
        if(cur){if($u("#sbar").hidden)$u("#bSearch").click();$u("#sq").focus();}
        else $u("#q").focus();
      }
    });
    if("matchMedia" in window&&window.matchMedia("(prefers-reduced-motion: reduce)").matches){
      document.documentElement.classList.add("ultra-reduced-motion");
    }
  }
  function initialize() {
    setupActivityShortcut();
    setupFan();
    setupVideoCallShortcut();
    setupWallpaperUploader();
    setupSwipeReply();
    setupSettingsActions();
    setupMessageInfo();
    setupShortcuts();
    setupDrafts();
    refresh();
    if(cur)applyWallpaper(validConversation());
    console.info(`Looply Ultra ${REVISION}: cartas, gestos, wallpaper da galeria, atividades, videochamada e enquetes locais.`);
  }
  initialize();
  window.LooplyUltra = Object.freeze({
    version:REVISION,
    openLetter:showLetterEditor,
    openActivity:showActivityCenter,
    showWallpaper:wallpaperChoiceSheet,
    simulateEvent:kind=>{const c=validConversation()||C[0];if(c)simulateEvent(c,kind);},
    inspect:()=>({conversations:C.length,activities:activities.length,unseen:unseenActivityCount(),
      messages:C.reduce((total,c)=>total+c.msgs.length,0),hasVideoButton:Boolean($u("#bVideo")),hasFan:Boolean($u("#attachFan"))})
  });
})();

</script>

<!-- The authenticated runtime is off-screen; the 3.0 model above is the only visible chat interface. -->
<div id="looplyLiveRuntime" aria-hidden="true" style="position:fixed;top:-300vh;left:-300vw;width:350px;height:500px;overflow:hidden;pointer-events:none">
<header data-site-header></header><main id="pageContent"></main>
</div>
<script>
/* Translates authenticated Looply data into the Ultra visual primitives. */
(() => {
  "use strict";
  let hooks=null;
  const originalHead=head,originalOpen=open,originalClose=closeConv,originalCav=cav,originalMsgMenu=msgMenu;
  let pendingDeleteId="";
  head=function liveHead(){
    originalHead();
    const heading=document.querySelector("#sub");
    if(heading)heading.textContent=C.length+" conversas · "+unreadTotal()+" mensagens não lidas";
    const fake=document.querySelector('#menu [data-m="sim"]');
    if(fake)fake.remove();
  };
  online=function liveContacts(){
    const names=Object.keys(USERS).filter(id=>id!==ME&&U(id).on).slice(0,20);
    document.querySelector("#online").innerHTML=names.map((id,i)=>
      '<button class="on1" style="--i:'+i+'" data-dm="'+esc(id)+'">'+av(id,56,1)+'<span>'+esc(U(id).n)+'</span></button>'
    ).join("");
  };
  status=function liveStatus(c){
    if(c.type==="group")return '<small>'+c.members.length+' participantes</small>';
    const other=c.members.find(id=>id!==ME);
    return U(other)?.on?'<small><span class="chat-live-dot"></span>online agora</small>':'<small>Não está online agora</small>';
  };
  cav=function liveConversationAvatar(c,size=52){
    if(c.type!=="group"||!c.coverUrl)return originalCav(c,size);
    return '<span class="av grp" style="--s:'+Number(size)+'px"><img src="'+esc(c.coverUrl)+'" alt=""></span>';
  };
  settle=function noFakeReplies(){};
  // Render R2-backed stickers inside the Ultra visual bubble without
  // exposing the raw placeholder "Figurinha" or injecting message HTML.
  let ultraMediaDecorator=null;
  const originalBubbleVisual=bubble;
  bubble=function secureLiveStickerBubble(conversation,message,index,messages){
    const html=originalBubbleVisual(conversation,message,index,messages);
    if(message.kind!=="sticker"||!message.stickerUrl)
      return ultraMediaDecorator?ultraMediaDecorator(html,message):html;
    let url;
    try{
      url=new URL(message.stickerUrl);
      // The URL is supplied solely by the authenticated R2 signer above.
      if(url.protocol!=="https:")return html;
    }catch{return html;}
    const template=document.createElement("template");
    template.innerHTML=html;
    const bubbleNode=template.content.querySelector(".m .b");
    if(!bubbleNode)return html;
    const image=document.createElement("img");
    image.className="sticker-actual";image.src=url.href;
    image.alt="Figurinha";image.loading="lazy";image.decoding="async";
    const meta=bubbleNode.querySelector(".meta");
    for(const child of [...bubbleNode.childNodes]){
      if(child!==meta&&!(child.nodeType===1&&child.matches(".fw,.q")))child.remove();
    }
    bubbleNode.insertBefore(image,meta||null);
    return template.innerHTML;
  };

  window.LooplyVisual={
    notice:m=>toast(m),
    mediaRenderer(render){ultraMediaDecorator=typeof render==="function"?render:null;},
    pendingDelete:()=>pendingDeleteId&&cur?{conversationId:cur,messageId:pendingDeleteId}:null,
    current:()=>cur,
    conversations:()=>C,
    open:id=>open(id),
    nativeCall(video=false){
      if(!cur||!hooks?.call)return toast("Abra uma conversa para iniciar uma chamada.");
      return hooks.call(cur,Boolean(video));
    },
    nativeGames(){
      if(!cur||!hooks?.games)return toast("Abra uma conversa para iniciar uma partida.");
      return hooks.games(cur);
    },
    nativeSchedule(){
      if(!cur||!hooks?.schedule)return toast("Abra uma conversa para agendar.");
      return hooks.schedule(cur);
    },
    rooms({selfId,profiles,conversations,selfAvatar,onlineUserIds=[]}){
      ME=selfId;
      const onlineNow=new Set(onlineUserIds);
      let userPreferences={};
      try{userPreferences=JSON.parse(localStorage.getItem("looply-chat-visual-v4:"+selfId)||"{}")||{};}catch{}
      Object.keys(USERS).forEach(key=>delete USERS[key]);
      for(const person of profiles||[]){
        const name=person.display_name||person.username||"Usuário";
        USERS[person.id]={n:name,g:["#8e4ccc","#7010b0"],on:onlineNow.has(person.id),username:person.username||""};
        if(person.avatarUrl)photos[person.id]=person.avatarUrl;
        else delete photos[person.id];
      }
      if(!USERS[ME])USERS[ME]={n:"Minha conta",g:["#8e4ccc","#7010b0"],on:false};
      if(selfAvatar)photos[ME]=selfAvatar;
      const old=new Map(C.map(c=>[c.id,c]));
      C=conversations.map(c=>{
        const existing=old.get(c.id),pref=userPreferences[c.id]||{};
        return {...c,
          pin:existing?.pin??pref.pin??0,
          mute:existing?.mute??pref.mute??0,
          fav:existing?.fav??pref.fav??0,
          arch:existing?.arch??pref.arch??0,
          nick:existing?.nick??pref.nick??"",
          wallpaper:existing?.wallpaper??pref.wallpaper??"",
          wallpaperTint:existing?.wallpaperTint??pref.wallpaperTint??.18,
          color:existing?.color??pref.color??"",
          msgs:existing&&c.id===cur?existing.msgs:c.msgs
        };
      });
      refresh();
      if(cur&&!conv(cur)){originalClose();}
      else if(cur){topbar();}
      const onlineLabel=document.querySelector("#online");
      if(onlineLabel)onlineLabel.setAttribute("aria-label","Pessoas");
    },
    storeMessages(id,messages){const c=conv(id);if(c)c.msgs=messages;},
    messages(id,messages){
      const c=conv(id);if(!c)return;
      c.msgs=messages;
      if(cur===id){
        const list=document.querySelector("#msgs"),near=list.scrollHeight-list.scrollTop-list.clientHeight<150;
        renderMsgs(near);
      }
      inbox();
    },
    install(callbacks){
      hooks=callbacks;
      open=function liveOpen(id){
        if(!conv(id))return;
        originalOpen(id);
        hooks?.opened(id);
      };
      openDm=function liveDirect(id){if(USERS[id]&&id!==ME)hooks?.direct(id);};
      // The original schedule() mutates a local array and cannot deliver with
      // the app closed. Replace it with the authenticated server scheduler.
      schedule=function serverOnlyChatSchedule(){return window.LooplyVisual.nativeSchedule();};
      msgMenu=function liveMessageMenu(id){pendingDeleteId=id;originalMsgMenu(id);};
      react=function liveReaction(id,emoji){if(cur)void hooks?.react(cur,id,emoji);};
      push=function livePush(c,m){if(c&&m)void Promise.resolve(hooks?.send(c,m));};
      sendText=function liveSendText(){
        const c=conv(cur),message=inp.value.trim();
        if(!c||!message)return;
        if(editing){
          const target=editing;
          editing=null;reply=null;ctx();inp.value="";grow();btn();
          void hooks?.edit(c,target,message);
        }else{
          inp.value="";grow();btn();document.querySelector("#pan")?.classList.remove("open");
          const replyTo=reply?.id||null;
          reply=null;ctx();
          // Do not lose typed text if Neon rejects a send.
          const sendingConversation=c.id;
          void Promise.resolve(hooks?.send(c,{kind:"text",text:message,replyTo})).then(saved=>{
            if(saved===false&&cur===sendingConversation&&!inp.value.trim()){
              inp.value=message;grow();btn();toast("Envio não confirmado. Tente novamente.");
            }
          }).catch(()=>{
            if(cur===sendingConversation&&!inp.value.trim()){
              inp.value=message;grow();btn();
            }
            toast("Falha de conexão. Mensagem preservada para reenvio.");
          });
        }
      };
      const menu=document.querySelector("#menu");
      menu.addEventListener("click",event=>{
        if(event.target.closest('[data-m="photo"]')){
          event.preventDefault();event.stopImmediatePropagation();location.href="perfil.html";
        }
      },true);
    }
  };
  refresh();
})();
</script>
