<!doctype html>
<html lang="pt-BR" data-theme="lilas">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#FAFAFB">
<title>Galeria — Looply</title><script src="config.js"></script>
<link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="assets/css/app.css"><link rel="stylesheet" href="assets/css/pages/shared.css"><link rel="stylesheet" href="assets/css/pages/gallery.css">
</head>
<body class="looply-page page-gallery"><div class="container-page">
<header class="page-header" data-site-header></header>
<main class="gallery-experience" data-gallery-experience>
<section class="gallery-topbar" aria-label="Galeria Looply">
<div class="gallery-topbar-context"><span class="gallery-eyebrow">LOOPLY · GALERIA & MÍDIA INTERATIVA</span><span class="gallery-context-title">Descubra & Compartilhe</span><span class="gallery-context-subtitle">Explore suas fotos, vídeos e momentos da comunidade Looply.</span></div>
<div class="gallery-top-actions"><button type="button" class="gallery-icon-button gallery-add-button" data-gallery-upload aria-label="Adicionar mídia" title="Adicionar mídia"><span>+</span></button>
<div class="gallery-more-wrap"><button type="button" class="gallery-icon-button" data-gallery-more aria-label="Mais opções" aria-expanded="false" title="Mais opções">•••</button>
<div class="gallery-more-menu" data-gallery-more-menu hidden><button type="button" data-gallery-set-passcode>Definir ou alterar senha das privadas</button><button type="button" data-gallery-clear-filters>Limpar filtros</button><button type="button" data-gallery-refresh>Atualizar mídias</button></div></div></div></section>
<nav class="gallery-categories" aria-label="Categorias da galeria">
<button type="button" class="gallery-category" data-gallery-category="all"><span class="gallery-category-icon">▦</span><span>Todas</span></button>
<button type="button" class="gallery-category is-active" data-gallery-category="recent"><span class="gallery-category-icon">◷</span><span>Recentes</span></button>
<button type="button" class="gallery-category" data-gallery-category="videos"><span class="gallery-category-icon">▷</span><span>Vídeos</span></button>
<button type="button" class="gallery-category" data-gallery-category="private"><span class="gallery-category-icon">♙</span><span>Privadas</span></button>
<button type="button" class="gallery-category" data-gallery-category="people"><span class="gallery-category-icon">♧</span><span>Pessoas</span></button></nav>
<section class="gallery-toolbar" aria-label="Busca e visualização">
<label class="gallery-search"><span aria-hidden="true">⌕</span><input type="search" data-gallery-search placeholder="Buscar mídias ou pessoas" autocomplete="off" aria-label="Buscar mídias ou pessoas"></label>
<div class="gallery-toolbar-actions"><label class="gallery-people-filter" data-gallery-people-wrap hidden><span>Pessoas</span><select data-gallery-people-filter multiple size="1" aria-label="Filtrar por pessoas"></select></label>
<label class="gallery-sort"><span class="sr-only">Ordenar mídias</span><select data-gallery-sort aria-label="Ordenar mídias"><option value="newest">Mais recentes</option><option value="oldest">Mais antigas</option><option value="name-asc">Nome A–Z</option><option value="name-desc">Nome Z–A</option></select></label>
<div class="gallery-view-switch" role="group" aria-label="Modo de visualização"><button type="button" data-gallery-view="grid" aria-pressed="true" aria-label="Grade" title="Grade">▦</button><button type="button" data-gallery-view="list" aria-pressed="false" aria-label="Lista" title="Lista">☷</button><button type="button" data-gallery-view="masonry" aria-pressed="false" aria-label="Masonry" title="Masonry">▥</button></div></div></section>
<p class="gallery-result-count" data-gallery-result-count aria-live="polite"></p>
<div id="pageContent" class="page-content gallery-content" aria-live="polite"></div>
</main><nav class="gallery-bottom-nav" aria-label="Navegação principal"><a href="home.html"><span aria-hidden="true">⌂</span><span>Início</span></a><a href="galeria.html" aria-current="page"><span aria-hidden="true">▦</span><span>Galeria</span></a><a href="musicas.html"><span aria-hidden="true">♫</span><span>Músicas</span></a><a href="chat.html"><span aria-hidden="true">◌</span><span>Chat</span></a><a href="cartas.html"><span aria-hidden="true">✉</span><span>Cartas</span></a></nav><footer class="looply-footer">Looply</footer></div><script type="module" src="assets/js/gallery.js"></script></body></html>
