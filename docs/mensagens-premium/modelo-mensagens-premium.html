<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mensagens — Looply</title>
<meta name="theme-color" content="#f5f0fa">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Cabin+Sketch:wght@700&display=swap" rel="stylesheet">
<style>
:root{--p:#7010b0;--pd:#5f1098;--bg:#f5f0fa;--b2:#f0e0f0;--t:#29252f;--m:#817b89;--l:rgba(102,82,126,.14);--s:#fff;--so:#faf7fc;--on:#fff;--ff:"Plus Jakarta Sans",system-ui,sans-serif;--fs:16px;--bub:var(--p);--sh:0 24px 70px rgba(65,45,94,.14);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{height:100%;margin:0;background:var(--bg);color:var(--t);font:400 var(--fs)/1.45 var(--ff);overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none;padding:0}
.i{width:20px;height:20px;flex:none}.sm .i,.i.s{width:16px;height:16px}
.app{height:100%;display:flex;flex-direction:column;max-width:1480px;margin:0 auto;background:radial-gradient(900px 500px at 8% -10%,var(--b2),transparent 70%),var(--bg)}
/* header */
.top{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--l);background:var(--s)}
.brand{display:flex;align-items:center;gap:10px;color:var(--p);text-decoration:none}
.brand .c{width:36px;height:36px;border:4px solid currentColor;border-radius:50%;display:grid;place-items:center;animation:spin 3s linear infinite}
.brand .c svg{width:18px;height:18px}.brand b{font:700 28px "Cabin Sketch",cursive;line-height:1}.brand small{display:block;font-size:11px;color:var(--m);letter-spacing:.04em;margin-top:-1px}
@keyframes spin{to{transform:rotate(360deg)}}
.nav{display:flex;gap:6px;margin-left:auto}
.nav a{min-height:42px;display:flex;align-items:center;gap:8px;padding:0 12px;border:1px solid var(--l);border-radius:14px;color:var(--m);text-decoration:none;font-size:13px;font-weight:600;position:relative;transition:.2s}
.nav a:hover{color:var(--p);transform:translateY(-1px)}.nav a.on{background:var(--p);color:var(--on);border-color:var(--p)}
.nav .bd{position:absolute;top:-6px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:#e5484d;color:#fff;font-size:10px;display:grid;place-items:center;padding:0 4px}
.ib{width:42px;height:42px;border-radius:14px;border:1px solid var(--l);background:var(--s);display:grid;place-items:center;color:var(--m);transition:.2s;position:relative;flex:none}
.ib:hover{color:var(--p);transform:translateY(-1px)}.ib:active{transform:scale(.94)}.ib.on{color:var(--p);background:var(--b2)}.ib.pr{background:var(--p);color:var(--on);border-color:var(--p)}
/* layout */
.main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(330px,390px) 1fr;gap:16px;padding:16px}
.side,.thread{background:var(--s);border:1px solid var(--l);border-radius:28px;box-shadow:var(--sh);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.sh{padding:18px 18px 8px;display:flex;align-items:center;gap:8px}.sh h1{margin:0;font-size:22px;flex:1}.eb{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--p)}
.sr{margin:6px 18px;display:flex;align-items:center;gap:8px;background:var(--so);border:1px solid var(--l);border-radius:16px;padding:0 12px;color:var(--m)}
.sr input{flex:1;min-width:0;height:44px;border:0;background:none;outline:0}.sr:focus-within{border-color:var(--p);box-shadow:0 0 0 3px color-mix(in srgb,var(--p) 18%,transparent)}
.stories{display:flex;gap:14px;overflow-x:auto;padding:10px 18px;scrollbar-width:none}.stories::-webkit-scrollbar{display:none}
.st{display:grid;justify-items:center;gap:4px;font-size:11px;color:var(--m);flex:none;width:58px}.st .av{box-shadow:0 0 0 2px var(--s),0 0 0 4px var(--p)}.st.me .av{box-shadow:0 0 0 2px var(--s),0 0 0 4px var(--l)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:6px 18px 10px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--l);background:var(--so);font-size:13px;font-weight:700;color:var(--m);transition:.2s;display:flex;align-items:center;gap:6px}
.chip.on{background:var(--p);border-color:var(--p);color:var(--on)}.chip em{font-style:normal;font-size:11px;opacity:.8}
.list{flex:1;overflow-y:auto;padding:4px 10px 14px}
.row{display:flex;gap:12px;align-items:center;padding:10px;border-radius:18px;cursor:pointer;transition:.18s;position:relative;animation:in .35s both}
.row:hover{background:var(--so)}.row.on{background:var(--b2)}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.rb{flex:1;min-width:0}.rt{display:flex;gap:6px;align-items:baseline}.rt b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px}.rt time{font-size:11px;color:var(--m)}
.rp{display:flex;gap:6px;align-items:center;color:var(--m);font-size:13px}.rp span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rp .i{width:15px;height:15px}
.row.un .rp,.row.un .rt time{color:var(--t);font-weight:700}
.ub{min-width:20px;height:20px;border-radius:10px;background:var(--p);color:var(--on);font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 6px}
.av{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;position:relative;flex:none;font-size:17px}
.av.on::after{content:"";position:absolute;right:0;bottom:0;width:13px;height:13px;border-radius:50%;background:#2fbf71;border:2.5px solid var(--s)}
.av.g{border-radius:30%}.av.lg{width:92px;height:92px;font-size:32px}.av.sm{width:38px;height:38px;font-size:14px}
.empty{text-align:center;color:var(--m);padding:48px 20px}.empty .big{font-size:44px}
/* thread */
.th{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--l);background:var(--s)}
.th .who{flex:1;min-width:0;cursor:pointer}.th .who b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.th .who small{color:var(--m);font-size:12px}
.back{display:none}
.msgs{flex:1;overflow-y:auto;padding:18px 16px;display:flex;flex-direction:column;gap:3px;background:linear-gradient(180deg,var(--so),var(--s));scroll-behavior:smooth}
.day{align-self:center;margin:12px 0;font-size:11px;font-weight:700;color:var(--m);background:var(--s);border:1px solid var(--l);padding:4px 12px;border-radius:999px}
.m{max-width:min(76%,520px);display:flex;flex-direction:column;animation:pop .28s both}.m.me{align-self:flex-end;align-items:flex-end}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.96)}}
.au{font-size:11px;font-weight:800;margin:6px 10px 2px}
.bu{padding:9px 13px;border-radius:20px 20px 20px 6px;background:var(--s);border:1px solid var(--l);position:relative;word-break:break-word;cursor:pointer;transition:.15s;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.me .bu{background:linear-gradient(135deg,var(--bub),color-mix(in srgb,var(--bub) 70%,#000));color:var(--on);border:0;border-radius:20px 20px 6px 20px}
.bu:hover{filter:brightness(.97)}.bu.st1{background:none;border:0;box-shadow:none;font-size:56px;line-height:1.1;padding:2px}
.bu .meta{display:flex;gap:4px;justify-content:flex-end;align-items:center;font-size:10.5px;opacity:.7;margin-top:2px}.bu .meta .i{width:14px;height:14px}.rd .meta .i{color:#7fe0ff;opacity:1}
.rq{border-left:3px solid var(--p);background:color-mix(in srgb,var(--p) 10%,transparent);padding:4px 8px;border-radius:8px;font-size:12px;margin-bottom:5px;opacity:.9}.me .rq{border-color:#fff;background:rgba(255,255,255,.18)}
.rx{display:flex;gap:2px;margin:-8px 8px 2px;position:relative;z-index:1}.rx span{background:var(--s);border:1px solid var(--l);border-radius:999px;padding:0 6px;font-size:13px;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.img{width:230px;max-width:100%;aspect-ratio:4/3;border-radius:14px;display:grid;place-items:center;font-size:44px;margin-bottom:4px}
.aud{display:flex;align-items:center;gap:10px;min-width:210px}.aud .pl{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.25);display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--p) 14%,transparent);color:var(--p)}.me .aud .pl{background:rgba(255,255,255,.25);color:inherit}
.wv{display:flex;align-items:center;gap:2px;height:28px;flex:1}.wv i{flex:1;background:currentColor;opacity:.55;border-radius:2px;min-width:2px}.aud.go .wv i{animation:wv .8s infinite alternate}@keyframes wv{to{transform:scaleY(.4)}}
.typing{align-self:flex-start;display:flex;gap:4px;background:var(--s);border:1px solid var(--l);padding:12px 14px;border-radius:20px 20px 20px 6px}.typing i{width:7px;height:7px;border-radius:50%;background:var(--m);animation:bn 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}@keyframes bn{50%{transform:translateY(-5px)}}
.sys{align-self:center;font-size:12px;color:var(--m);background:var(--b2);padding:6px 14px;border-radius:14px;margin:6px 0;text-align:center}
.ctx{display:none;margin:8px 14px 0;padding:8px 12px;border-radius:14px;background:var(--so);border-left:4px solid var(--p);align-items:center;gap:8px;font-size:13px}.ctx.on{display:flex}.ctx div{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmp{display:flex;align-items:flex-end;gap:8px;padding:12px 14px;position:relative}
.cmp .box{flex:1;display:flex;align-items:flex-end;background:var(--so);border:1px solid var(--l);border-radius:24px;padding:3px 6px;transition:.2s}.cmp .box:focus-within{border-color:var(--p);box-shadow:0 0 0 3px color-mix(in srgb,var(--p) 16%,transparent)}
.cmp textarea{flex:1;min-width:0;resize:none;border:0;background:none;outline:0;max-height:120px;padding:10px 6px;line-height:1.35}
.cmp .ib{border:0;background:none;border-radius:50%}.cmp .send{width:46px;height:46px;border-radius:50%;background:var(--p);color:var(--on);display:grid;place-items:center;box-shadow:0 8px 18px color-mix(in srgb,var(--p) 40%,transparent);transition:.2s}.send:active{transform:scale(.9)}
.rec{display:none;flex:1;align-items:center;gap:10px;color:#e5484d;font-weight:700}.rec.on{display:flex}.rec i{width:10px;height:10px;border-radius:50%;background:#e5484d;animation:bn .8s infinite}.cmp.rc .box{display:none}.cmp.rc .rec{display:flex}
.emo{position:absolute;left:14px;bottom:72px;width:min(340px,calc(100% - 28px));background:var(--s);border:1px solid var(--l);border-radius:22px;box-shadow:var(--sh);padding:10px;z-index:5;display:none;animation:pop .2s}.emo.on{display:block}
.et{display:flex;gap:2px;margin-bottom:6px}.et button{flex:1;height:34px;border-radius:10px;font-size:18px}.et .on{background:var(--b2)}
.eg{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;max-height:200px;overflow:auto}.eg button{font-size:23px;height:38px;border-radius:10px}.eg button:hover{background:var(--b2);transform:scale(1.2)}
.att{position:absolute;left:14px;bottom:72px;background:var(--s);border:1px solid var(--l);border-radius:22px;box-shadow:var(--sh);padding:10px;display:none;grid-template-columns:repeat(3,76px);gap:8px;z-index:5}.att.on{display:grid;animation:pop .2s}
.att button{display:grid;justify-items:center;gap:6px;font-size:12px;font-weight:600;padding:8px 0;border-radius:14px}.att button:hover{background:var(--so)}.att b{width:44px;height:44px;border-radius:15px;display:grid;place-items:center;color:#fff}
.blk{padding:14px;text-align:center;color:var(--m);font-size:14px}
.find{display:none;padding:8px 14px;gap:8px;border-bottom:1px solid var(--l)}.find.on{display:flex}.find input{flex:1;height:38px;border-radius:12px;border:1px solid var(--l);background:var(--so);padding:0 12px;outline:0}
mark{background:#ffe27a;color:#222;border-radius:4px}
.ph{flex:1;display:grid;place-items:center;text-align:center;color:var(--m);padding:30px}.ph .big{width:120px;height:120px;border-radius:50%;background:var(--b2);display:grid;place-items:center;color:var(--p);margin:0 auto 14px;font-size:50px}
/* sheets */
#ov{position:fixed;inset:0;background:rgba(20,10,35,.5);backdrop-filter:blur(6px);z-index:50;display:none;align-items:center;justify-content:center;padding:16px}#ov.on{display:flex}
.sheet{background:var(--s);width:min(100%,460px);max-height:min(88dvh,760px);overflow:auto;border-radius:28px;box-shadow:var(--sh);padding:20px;animation:pop .25s}
.sheet h2{margin:0 0 12px;font-size:19px;display:flex;align-items:center;gap:8px}.sheet h2 span{flex:1}
.dr{position:fixed;top:0;right:0;bottom:0;width:min(100%,420px);background:var(--s);z-index:60;transform:translateX(105%);transition:transform .35s cubic-bezier(.2,.8,.2,1);box-shadow:-20px 0 60px rgba(0,0,0,.2);overflow:auto;padding:calc(18px + env(safe-area-inset-top,0px)) 18px calc(24px + env(safe-area-inset-bottom,0px))}.dr.on{transform:none}
.ctr{text-align:center;display:grid;justify-items:center;gap:6px;margin:6px 0 16px}.ctr h3{margin:0;font-size:20px}.ctr small{color:var(--m)}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}.qa button{display:grid;justify-items:center;gap:4px;padding:10px 0;border-radius:16px;background:var(--so);border:1px solid var(--l);font-size:11.5px;font-weight:700;color:var(--p)}
.opt{display:flex;align-items:center;gap:12px;width:100%;padding:12px 6px;border-radius:14px;text-align:left;font-weight:600;font-size:14.5px;transition:.15s}.opt:hover{background:var(--so)}.opt .i{color:var(--m)}.opt.dg,.opt.dg .i{color:#e5484d}.opt small{display:block;font-weight:400;color:var(--m);font-size:12px}.opt>div{flex:1}
.grp{margin:14px 0 4px;font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--m);text-transform:uppercase}
.sw{position:relative;width:46px;height:27px;flex:none}.sw input{opacity:0;position:absolute;inset:0;margin:0;cursor:pointer;z-index:1}.sw i{position:absolute;inset:0;border-radius:14px;background:var(--l);transition:.2s}.sw i::after{content:"";position:absolute;left:3px;top:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 2px 4px rgba(0,0,0,.25)}.sw input:checked+i{background:var(--p)}.sw input:checked+i::after{transform:translateX(19px)}
.fld{width:100%;height:46px;border-radius:14px;border:1px solid var(--l);background:var(--so);padding:0 14px;outline:0;margin:4px 0 8px}.fld:focus{border-color:var(--p)}
.sws{display:flex;flex-wrap:wrap;gap:10px;padding:6px 0}.sws button{width:38px;height:38px;border-radius:50%;border:3px solid var(--s);box-shadow:0 0 0 1.5px var(--l);transition:.15s}.sws button.on{box-shadow:0 0 0 3px var(--p)}.sws button:hover{transform:scale(1.1)}
.btn{min-height:46px;padding:0 18px;border-radius:15px;font-weight:700;background:var(--p);color:var(--on);width:100%;margin-top:8px}.btn.gh{background:var(--so);color:var(--t);border:1px solid var(--l)}
.pk{display:flex;align-items:center;gap:12px;padding:8px;border-radius:14px;cursor:pointer}.pk:hover{background:var(--so)}.pk b{flex:1}.pk input{width:20px;height:20px;accent-color:var(--p)}
.rxs{display:flex;justify-content:space-around;background:var(--so);border-radius:999px;padding:6px;margin-bottom:10px}.rxs button{font-size:26px;width:44px;height:44px;border-radius:50%;transition:.15s}.rxs button:hover{transform:scale(1.3) translateY(-4px)}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--t);color:var(--bg);padding:11px 18px;border-radius:14px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.3s;z-index:90;max-width:90vw;text-align:center}.toast.on{opacity:1;transform:translate(-50%,0)}
/* call */
#call{position:fixed;inset:0;z-index:80;display:none;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(40px + env(safe-area-inset-top,0px)) 20px calc(34px + env(safe-area-inset-bottom,0px));color:#fff;background:radial-gradient(circle at 50% 30%,color-mix(in srgb,var(--p) 70%,#000),#10081c 75%)}#call.on{display:flex;animation:pop .3s}
#call .nm{text-align:center}#call h2{margin:12px 0 2px;font-size:26px}#call p{margin:0;opacity:.75}
.pulse{position:relative;display:grid;place-items:center}.pulse::before,.pulse::after{content:"";position:absolute;inset:-14px;border-radius:50%;border:2px solid rgba(255,255,255,.35);animation:pl 2s infinite}.pulse::after{animation-delay:1s}@keyframes pl{from{transform:scale(.8);opacity:1}to{transform:scale(1.5);opacity:0}}
.pip{position:absolute;right:16px;top:calc(16px + env(safe-area-inset-top,0px));width:96px;height:132px;border-radius:18px;background:linear-gradient(160deg,#444,#222);border:2px solid rgba(255,255,255,.4);display:none;place-items:center;font-size:12px}.vid .pip{display:grid}
.cc{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}.cc button{width:60px;height:60px;border-radius:50%;background:rgba(255,255,255,.16);backdrop-filter:blur(10px);display:grid;place-items:center;color:#fff;transition:.2s}.cc button.off{background:#fff;color:#222}.cc .end{background:#e5484d;transform:rotate(135deg)}.cc button:active{transform:scale(.9)}.cc .end:active{transform:rotate(135deg) scale(.9)}
/* responsive */
.bn{display:none}
@media(max-width:1080px){.nav a span{display:none}.nav a{padding:0 11px}}
@media(max-width:860px){
.main{grid-template-columns:1fr;padding:0;gap:0}.side,.thread{border-radius:0;border:0;box-shadow:none}.thread{display:none}.app.in .side{display:none}.app.in .thread{display:flex}
.back{display:grid}.top .nav{display:none}.top{margin-left:0}.top .sp{flex:1}
.bn{display:flex;border-top:1px solid var(--l);background:var(--s);padding:6px 4px}.app.in .bn{display:none}.bn a{flex:1;display:grid;justify-items:center;gap:1px;padding:6px 0;color:var(--m);text-decoration:none;font-size:10px;font-weight:700;border-radius:12px;position:relative}.bn a.on{color:var(--p)}.bn .bd{position:absolute;top:0;right:22%;background:#e5484d;color:#fff;border-radius:8px;font-size:9px;padding:0 5px}
.app.in .top{display:none}.m{max-width:86%}.emo,.att{left:8px}}
@media(max-width:380px){.bn a{font-size:9px}.i{width:19px;height:19px}.qa{grid-template-columns:repeat(2,1fr)}.img{width:190px}}
@media(min-width:1500px){.main{padding:22px;gap:22px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
:focus-visible{outline:3px solid color-mix(in srgb,var(--p) 55%,transparent);outline-offset:2px}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top"><a class="brand" href="home.html" aria-label="Looply, início"><span class="c"><svg viewBox="0 0 100 100" fill="none"><path d="M50 15A35 35 0 0 1 85 50" stroke="currentColor" stroke-width="9"/></svg></span><span><b>Looply</b><small>MoissWorld</small></span></a><span class="sp"></span><nav class="nav" id="nav" aria-label="Navegação principal"></nav><button class="ib" data-a="settings" aria-label="Configurações gerais"></button></header>
  <div class="main">
    <aside class="side" id="side"></aside>
    <section class="thread" id="thread"></section>
  </div>
  <nav class="bn" id="bn" aria-label="Navegação principal"></nav>
</div>
<div id="ov"></div><aside class="dr" id="dr" aria-label="Detalhes"></aside><div id="call"></div><div class="toast" id="toast" role="status"></div>
