name: Looply TTT responsive visual tests
on:
  pull_request:
    paths:
      - "src/chat-ttt.js"
      - "src/chat-enhancements.js"
      - "assets/css/pages/chat.css"
      - "scripts/check-ttt-visual.mjs"
      - ".github/workflows/ttt-visual.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  responsive:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Run actual game UI tests
        run: node scripts/check-ttt-visual.mjs
      - name: Upload rendered screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: looply-neon-ttt-mobile-screenshots
          path: smoke-results/neon-ttt-20261031/
          retention-days: 14
          if-no-files-found: warn
