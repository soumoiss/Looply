name: Looply real WebRTC controller two-peer test
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/chat-calls.js"
      - "src/call-ice-gate.js"
      - "tests/ci-webrtc-looply-call-controller.mjs"
      - ".github/workflows/ci-webrtc-looply-controller.yml"
  push:
    branches: [main]
    paths:
      - "src/chat-calls.js"
      - "src/call-ice-gate.js"
      - "tests/ci-webrtc-looply-call-controller.mjs"
      - ".github/workflows/ci-webrtc-looply-controller.yml"
permissions:
  contents: read
jobs:
  production-controller:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Real two-way audio and video with Looply production controller
        run: node tests/ci-webrtc-looply-call-controller.mjs
      - name: Upload RTP statistics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Looply-production-call-controller-two-peer-rtp
          path: smoke-results/webrtc-controller/
          retention-days: 14
