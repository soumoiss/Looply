# Server-only maintenance deployment. Requires NEON_API_KEY in GitHub Secrets.
# No keys are embedded in GitHub Pages, JavaScript frontend or Android APK.
name: Deploy Looply storage housekeeping
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backend/neon-storage-gc/**'
      - 'migration/20261031_storage_gc_queue.sql'
      - '.github/workflows/storage-housekeeping.yml'
permissions:
  contents: read
concurrency:
  group: looply-gc-deployment
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      PROJECT_ID: small-scene-81115187
      BRANCH_ID: br-round-fog-b7pseu7j
    steps:
      - uses: actions/checkout@v4
      - name: Verify Neon deployment credential
        run: |
          if [ -z "$NEON_API_KEY" ]; then
            echo "::error::Missing NEON_API_KEY repository secret. The collector source is published, but its scheduled deployment is NOT active."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Deploy Neon Function
        run: |
          npx --yes neon@8.13.2 functions deploy looplygc \
            --src backend/neon-storage-gc/index.mjs \
            --no-bundle --project-id "$PROJECT_ID" --branch "$BRANCH_ID" --wait
      - name: Ensure server-side scheduled trigger exists
        shell: bash
        run: |
          set -euo pipefail
          API="https://console.neon.tech/api/v2/projects/$PROJECT_ID/branches/$BRANCH_ID/triggers"
          existing=$(curl --retry 3 --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $NEON_API_KEY" "$API")
          if echo "$existing" | jq -e '.triggers[]? | select(.function_slug=="looplygc" and .type=="schedule" and .name=="looply-storage-gc")' >/dev/null; then
            echo "Scheduled collector already registered."
          else
            curl --retry 3 --fail-with-body --silent --show-error \
              -X POST -H "Authorization: Bearer $NEON_API_KEY" \
              -H "Content-Type: application/json" \
              --data '{"type":"schedule","function_slug":"looplygc","name":"looply-storage-gc","function_path":"/","schedule":{"cron":"*/2 * * * *"},"enabled":true}' \
              "$API" | jq -e '.trigger.enabled==true'
          fi
