name: Stories Studio validation

on:
  pull_request:
    paths:
      - 'src/story-studio.js'
      - 'src/story-ar*.js'
      - 'assets/story-effects/**'
      - 'scripts/check-story-ar-browser.mjs'
      - 'scripts/check-story-face-runtime.mjs'
      - 'tests/story-ar-open.test.mjs'
      - 'src/story-music-catalog.js'
      - 'src/story-music-picker.js'
      - 'src/story-audio-mixer.js'
      - 'tests/story-audio-mixer.test.mjs'
      - 'assets/css/pages/home.css'
      - 'backend/story-music-discovery/worker.mjs'
      - 'scripts/check-story-music-live.mjs'
      - 'scripts/check-story-posted-audio.mjs'
      - 'tests/story-posted-music.test.mjs'
      - 'scripts/check-story-music-layout.mjs'
      - 'tests/story-music-catalog.test.mjs'
      - 'src/stories.js'
      - 'assets/css/pages/story-studio.css'
      - 'assets/js/home.js'
      - 'home.html'
      - 'tests/story-studio.test.mjs'
      - '.github/workflows/stories-studio.yml'
  push:
    branches:
      - 'feat/stories-studio-neon-20261026'

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and execute test suite
        run: npm test
      - name: Prepare audio inspection tool
        run: |
          if ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
      - name: Verify real audio track in recorded Story media
        run: node scripts/check-story-posted-audio.mjs
      - name: Save ffprobe-verified Story sample videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stories-9x16-audio-video
          path: qa-artifacts/
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify live AR pixel deformation in headless Chrome
        run: node scripts/check-story-ar-browser.mjs
      - name: Verify mobile song cards in headless Chrome
        run: node scripts/check-story-music-layout.mjs
      - name: Check live multi-provider music search
        run: node scripts/check-story-music-live.mjs
      - name: Reject legacy services in Stories Studio
        run: |
          if grep -Eiq 'supabase|spotify' src/story-studio.js src/stories.js; then
            echo 'Legacy provider reference in Stories modules' >&2
            exit 1
          fi
      - name: Initialize real MediaPipe FaceLandmarker in headless Chrome
        run: node scripts/check-story-face-runtime.mjs
