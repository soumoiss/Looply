name: Looply premium chat visual regression
on:
  pull_request:
    paths:
      - "src/chat.js"
      - "src/chat-premium.js"
      - "src/chat-premium-cards.js"
      - "src/chat-enhancements.js"
      - "assets/css/pages/chat-premium.css"
      - "assets/css/pages/chat-features.css"
      - "assets/css/pages/chat-foundation.css"
      - "chat.html"
      - "conversa.html"
      - "scripts/check-chat-premium-visual.mjs"
      - ".github/workflows/chat-premium-visual.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  viewport:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install visual tests dependency
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Validate premium chat responsive list and message composer
        run: node scripts/check-chat-premium-visual.mjs
      - name: Upload sanitized render screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: looply-premium-chat-responsive
          path: smoke-results/chat-premium-20261103/
          retention-days: 14
          if-no-files-found: warn
