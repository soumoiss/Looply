# Publish stable main and a separately testable Stories preview.
# The preview is bundled into the same GitHub Pages artifact; it never replaces main.
name: Deploy Looply to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ["Stories Studio validation"]
    types: [completed]
    branches: [feat/stories-studio-neon-20261026]

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Check out stable main
        uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Build production site and run tests
        run: npm test
      - name: Verify production files
        run: |
          test -s dist/index.html
          test -s dist/login.html
          test -s dist/home.html
          test -s dist/chat.html
          test -s dist/src/splash.js
          test -s dist/src/chat.js
          test -s dist/src/chat-enhancements.js
          test -s dist/assets/css/pages/chat.css
          test -s dist/assets/css/splash.css
      - name: Check out Stories preview branch
        uses: actions/checkout@v5
        with:
          ref: feat/stories-studio-neon-20261026
          path: stories-preview-src
          persist-credentials: false
      - name: Validate and build Stories preview separately
        working-directory: stories-preview-src
        run: npm test
      - name: Add Stories preview without changing production
        run: |
          set -euo pipefail
          test -s stories-preview-src/dist/home.html
          test -s stories-preview-src/dist/src/story-studio.js
          test -s stories-preview-src/dist/assets/css/pages/story-studio.css
          mkdir -p dist/preview/stories
          cp -a stories-preview-src/dist/. dist/preview/stories/
          # Preview must not register a second service worker that clears the
          # stable app's origin-wide CacheStorage.
          printf '%s\n' 'export async function registerLooplyServiceWorker() { return null; }' > dist/preview/stories/src/service-worker.js
          test -s dist/preview/stories/home.html
          test -s dist/preview/stories/src/story-studio.js
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-${{ github.run_attempt }}
          path: dist

  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-22.04
    timeout-minutes: 7
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
