# Deploy the latest gallery, authentication, theme, chat, and Cartas updates from main.
name: Deploy Looply to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Build site and run tests
        run: npm test
      - name: Verify deployment artifact contains key pages and chat assets
        run: |
          test -s dist/index.html
          test -s dist/login.html
          test -s dist/home.html
          test -s dist/chat.html
          test -s dist/src/splash.js
          test -s dist/src/chat.js
          test -s dist/src/chat-enhancements.js
          test -s dist/assets/css/pages/chat.css
          test -s dist/assets/css/splash.css
          test -s dist/assets/css/pages/stories-instagram.css
          grep -q 'stories-instagram.css' dist/home.html
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
