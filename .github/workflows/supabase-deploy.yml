name: Deploy Looply backend to Supabase

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      # Project ref is public and is already the Supabase URL used by Looply.
      SUPABASE_PROJECT_ID: qixocgetiwlrsbadpbvh
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate deployment secrets
        shell: bash
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "Missing SUPABASE_ACCESS_TOKEN"; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo "Missing SUPABASE_DB_PASSWORD"; exit 1; }

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Apply pending database migrations
        run: supabase db push

      - name: Deploy protected Edge Functions
        run: |
          supabase functions deploy looply-admin --project-ref "$SUPABASE_PROJECT_ID"
          supabase functions deploy looply-youtube-playlist --project-ref "$SUPABASE_PROJECT_ID"
