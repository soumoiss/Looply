name: Deploy Looply backend to Supabase

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      # Project ref is public and is already the Supabase URL used by Looply.
      SUPABASE_PROJECT_ID: qixocgetiwlrsbadpbvh
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate deployment secrets
        shell: bash
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "Missing SUPABASE_ACCESS_TOKEN"; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo "Missing SUPABASE_DB_PASSWORD"; exit 1; }

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          # Pin the CLI so CI does not depend on the GitHub releases API's
          # latest-version lookup (which can be rate-limited).
          version: 2.118.0-beta.37

      - name: Link production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Apply pending database migrations
        shell: bash
        run: |
          set +e
          push_output="$(supabase db push 2>&1)"
          push_status=$?
          set -e
          printf '%s\n' "$push_output"

          if [ "$push_status" -eq 0 ]; then
            exit 0
          fi

          needs_repair=false
          if grep -q "Remote migration versions not found in local migrations directory." <<< "$push_output"; then
            needs_repair=true
          fi

          needs_include_all=false
          if grep -q "Found local migration files to be inserted before the last migration on remote database." <<< "$push_output"; then
            needs_include_all=true
          fi

          if [ "$needs_repair" = false ] && [ "$needs_include_all" = false ]; then
            exit "$push_status"
          fi

          if [ "$needs_repair" = true ]; then
            # Supabase refuses to push when an old migration was applied
            # remotely but its file was removed from this repository. Repair
            # only the exact versions reported by this project's failed run.
            supabase migration repair \
              20261016195217 20261016200337 20261017014757 20261017021312 \
              20261017194314 20261018032328 20261018035937 20261018040021 \
              20261018043427 20261018122243 20261018184648 20261018184704 \
              20261018190617 20261018191316 20261018191536 20261018234416 \
              20261019035614 20261019040810 20261019041408 20261019042221 \
              20261019043048 20261019043331 20261019043432 20261019044455 \
              20261019044607 20261019044648 20261019045041 20261019051040 \
              20261019051622 \
              20261019051947 20261019053101 20261019053809 20261019060251 \
              20261019104935 20261019104953 20261019105809 20261019112244 \
              20261019112835 20261019112843 20261019114104 20261019115515 \
              20261019121710 \
              20261019123550 20261019174315 \
              --status reverted
          fi

          # The repaired history can contain a newer remote version while
          # local migrations still need to be applied before it.
          supabase db push --include-all

      - name: Deploy protected Edge Functions
        run: |
          supabase functions deploy looply-admin --project-ref "$SUPABASE_PROJECT_ID"
          supabase functions deploy looply-youtube-playlist --project-ref "$SUPABASE_PROJECT_ID"
