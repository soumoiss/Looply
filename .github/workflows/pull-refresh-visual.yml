name: Looply pull-to-refresh mobile gesture regression
on:
  pull_request:
    paths:
      - "src/pull-to-refresh.js"
      - "src/page-runtime.js"
      - "assets/css/pages/shared.css"
      - "scripts/check-pull-refresh-visual.mjs"
      - ".github/workflows/pull-refresh-visual.yml"
  push:
    branches: [feat/pull-to-refresh-safe-mobile-20261031]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Exercise touch gesture, offline failure, drafts and modals
        run: node scripts/check-pull-refresh-visual.mjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: looply-pull-refresh-mobile-screenshots
          path: smoke-results/pull-refresh/
          retention-days: 14
          if-no-files-found: warn
