name: Diagnose Supabase API restriction
on:
  push:
    paths:
      - .github/workflows/diagnose-supabase-restriction.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect public Supabase health API and restriction code
        shell: bash
        run: |
          set -euo pipefail
          for project in qixocgetiwlrsbadpbvh kgrxvsizfmaxlosiitec; do
            echo "Project: $project"
            status=$(curl --silent --show-error --max-time 20 -o /tmp/looply-response.json -w '%{http_code}' "https://$project.supabase.co/auth/v1/health")
            echo "HTTP $status"
            python3 -c 'import json,re; body=open("/tmp/looply-response.json", encoding="utf8").read(); data=json.loads(body); message=str(data.get("message") or data.get("error") or data.get("msg") or ""); codes=re.findall(r"exceed(?:ed)?_[a-z_]+|overdue_payment", message); print("Restriction:", ", ".join(codes) if codes else message[:250])'
          done
