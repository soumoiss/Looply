name: Build Looply Android APK

on:
  push:
    branches:
      - main
      - codex/android-3.0.1
      - codex/looply-android-fcm-302
    paths:
      - "android/**"
      - "assets/**"
      - "src/**"
      - "*.html"
      - "styles.css"
      - "config.js"
      - "scripts/build.mjs"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Looply
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Build the bundled web application
        run: npm run build
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install Android API 36 and Build Tools 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Verify Firebase client matches Android applicationId
        run: |
          node -e 'const j=require("./android/app/google-services.json");if(j.project_info.project_id!=="looplyv3"||!j.client.some(x=>x.client_info.android_client_info.package_name==="com.looply.app"))process.exit(1);'
      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace assembleDebug
      - name: Verify package, version, and APK signature
        run: |
          BADGING=$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging android/app/build/outputs/apk/debug/app-debug.apk)
          printf '%s\n' "$BADGING" | head -n 5
          printf '%s\n' "$BADGING" | grep -Fq "name='com.looply.app'"
          printf '%s\n' "$BADGING" | grep -Fq "versionCode='302'"
          printf '%s\n' "$BADGING" | grep -Fq "versionName='3.0.2'"
          printf '%s\n' "$BADGING" | grep -Fq "sdkVersion:'24'"
          printf '%s\n' "$BADGING" | grep -Fq "targetSdkVersion:'36'"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v6
        with:
          name: Looply-3.0.2-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
