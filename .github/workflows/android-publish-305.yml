name: Publish signed Looply 3.0.5 direct APK

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/android-publish-305.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN: "41165832817"
      SOURCE_SHA: "6cd63d681326e55334837fcbb5239460c011acc5"
      RELEASE_TAG: "android-v3.0.5-signed-20261031"
    steps:
      - name: Download already built signed Release from successful trusted main run
        run: |
          set -euo pipefail
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN}" --jq .conclusion)" = success
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN}" --jq .head_sha)" = "$SOURCE_SHA"
          mkdir -p release
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --name Looply-3.0.5-signed-release --dir release
          # upload-artifact preserves subdirectories when sources have
          # different root paths (APK and AAB). Locate both deterministically.
          APK_PATH="$(find release -type f -name 'app-release.apk' -print -quit)"
          AAB_PATH="$(find release -type f -name 'app-release.aab' -print -quit)"
          test -n "$APK_PATH" && test -s "$APK_PATH"
          test -n "$AAB_PATH" && test -s "$AAB_PATH"
          if [ "$APK_PATH" != release/app-release.apk ]; then cp "$APK_PATH" release/app-release.apk; fi
          if [ "$AAB_PATH" != release/app-release.aab ]; then cp "$AAB_PATH" release/app-release.aab; fi
      - name: Set up Android APK verification tools
        uses: android-actions/setup-android@v4
      - name: Verify APK and package/Android SDK compatibility
        run: |
          set -euo pipefail
          sdkmanager "build-tools;36.0.0" "platforms;android-36"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          SIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$SIGNER" verify --verbose --print-certs release/app-release.apk
          BADGING=$("$AAPT" dump badging release/app-release.apk)
          grep -Fq "name='com.looply.app'" <<< "$BADGING"
          grep -Fq "versionCode='305'" <<< "$BADGING"
          grep -Fq "versionName='3.0.5'" <<< "$BADGING"
          grep -Fq "sdkVersion:'24'" <<< "$BADGING"
          test "$(stat -c %s release/app-release.apk)" -gt 1000000
          mv release/app-release.apk release/Looply-3.0.5-Android-ASSINADO.apk
          (cd release && sha256sum Looply-3.0.5-Android-ASSINADO.apk > SHA256SUMS.txt)
      - name: Publish direct public GitHub Release download
        run: |
          set -euo pipefail
          cat > release-notes.md <<'EOF'
          Looply Android 3.0.5 — APK assinado e pronto para compartilhamento pelo WhatsApp.

          Baixe o arquivo .apk no próprio telefone Android; é desnecessário extrair arquivos ZIP.

          Pacote: com.looply.app. Android mínimo: 7.0 (API 24).
          Inclui serviço FCM, identificação de notificações, interface nativa de chamada e mídia WebView.

          Se o Android informar "App não instalado" durante uma atualização, verifique se a versão anterior
          usa assinatura diferente. Não existe atualização sobre assinatura incompatível:
          faça backup dos dados locais e desinstale a versão antiga somente se necessário.
          O Android exige autorização do usuário para instalar APK compartilhado por WhatsApp/navegador.
          A instalação não é garantida para aparelhos inferiores ao Android 7 ou sistemas incompatíveis.
          EOF
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/Looply-3.0.5-Android-ASSINADO.apk release/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" release/Looply-3.0.5-Android-ASSINADO.apk release/SHA256SUMS.txt \
              --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" \
              --title "Looply Android 3.0.5 — APK assinado" \
              --notes-file release-notes.md --latest
          fi
