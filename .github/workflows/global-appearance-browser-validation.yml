name: Global appearance browser validation
on:
  pull_request:
    paths:
      - "src/theme.js"
      - "src/theme-bootstrap.js"
      - "src/why-now-integration.js"
      - "src/why-now-embedded.js"
      - "assets/js/settings.js"
      - "assets/css/global-theme-typography.css"
      - "scripts/build.mjs"
      - "scripts/check-global-appearance-browser.mjs"
      - "tests/global-appearance-unification-20261110.test.mjs"
      - ".github/workflows/global-appearance-browser-validation.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build all routes and verify theme contracts
        run: |
          npm run build
          node --test tests/global-appearance-unification-20261110.test.mjs
      - name: Install isolated Chromium browser
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Check theme application and synchronization on real pages
        run: node scripts/check-global-appearance-browser.mjs
      - name: Save appearance screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: global-appearance-theme-previews
          path: smoke-results/appearance-*.png
          if-no-files-found: warn
          retention-days: 14
