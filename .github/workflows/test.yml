name: Test Looply
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/gallery-redesign-from-scratch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
