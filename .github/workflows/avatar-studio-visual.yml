name: Looply avatar studio visual regression
on:
  pull_request:
    paths:
      - "src/avatar-crop-editor.js"
      - "src/profile-page.js"
      - "assets/css/pages/profile.css"
      - "scripts/check-avatar-studio-visual.mjs"
      - ".github/workflows/avatar-studio-visual.yml"
  push:
    branches: [feat/profile-avatar-editor-square-20261031]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install headless Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Verify editor with real PNG and touch gestures
        run: node scripts/check-avatar-studio-visual.mjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: looply-avatar-studio-responsive
          path: smoke-results/avatar-studio/
          retention-days: 14
          if-no-files-found: warn
