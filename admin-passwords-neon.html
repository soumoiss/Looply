<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Senhas Neon — Looply</title><style>body{font:16px system-ui;background:#f6f1fa;color:#241b2b;padding:18px}main{max-width:540px;margin:25px auto;padding:24px;background:#fff;border:1px solid #ddd;border-radius:20px}h1{color:#62358b}label{display:block;margin:15px 0 5px}select,input,button{box-sizing:border-box;width:100%;padding:13px;border-radius:10px;border:1px solid #aaa;font:inherit}button{margin-top:15px;background:#6536a0;color:white;border:0}button:disabled{opacity:.5}#status{white-space:pre-wrap}small{color:#666}</style></head><body><main><h1>Redefinir senhas do Looply</h1><p>Área administrativa de homologação do Neon. As contas e os perfis serão preservados.</p><p id="status" role="status">Verificando sessão de administrador…</p><section id="panel" hidden><label for="user">Conta a alterar</label><select id="user"></select><label for="password">Nova senha</label><input id="password" type="password" autocomplete="new-password" minlength="12" maxlength="128"><label for="confirm">Confirmar nova senha</label><input id="confirm" type="password" autocomplete="new-password" minlength="12" maxlength="128"><button id="save" type="button">Redefinir senha da conta selecionada</button><small>Use uma senha diferente para cada pessoa, com pelo menos 12 caracteres. Não compartilhe senhas no chat.</small></section><p><a href="/login-neon.html">Voltar ao login Neon</a></p></main><script type="module" src="/src/neon-password-admin.js"></script></body></html>
